name: world-ci

on:
  push:
    branches: ["**"]
    paths:
      - "world/**"
      - "world-backend/**"
      - "scripts/export_world_vocabulary.py"
      - ".github/workflows/world-ci.yml"
  pull_request:
    paths:
      - "world/**"
      - "world-backend/**"
      - "scripts/export_world_vocabulary.py"
      - ".github/workflows/world-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: world/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
