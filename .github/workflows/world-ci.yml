name: world-ci

on:
  push:
    branches: ["**"]
    paths:
      - "world-backend/**"
      - "scripts/export_world_vocabulary.py"
      - ".github/workflows/world-ci.yml"
  pull_request:
    paths:
      - "world-backend/**"
      - "scripts/export_world_vocabulary.py"
      - ".github/workflows/world-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
