<style>
  #fxb-gallery{--purple-2:#662d92;--ink:#241a36;--muted:#6f6883;
    font-family:'Montserrat',Arial,sans-serif;background:#f4f1fa;-webkit-font-smoothing:antialiased}
  #fxb-gallery *{box-sizing:border-box;margin:0;padding:0}
  #fxb-gallery .fxb-section{max-width:1200px;margin:0 auto;padding:90px 24px 80px}
  #fxb-gallery .fxb-gal-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;margin-bottom:48px}
  #fxb-gallery .fxb-gal-eyebrow{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--purple-2);background:rgba(102,45,146,.08);padding:9px 16px;border-radius:100px}
  #fxb-gallery .fxb-gal-dot{width:7px;height:7px;border-radius:50%;background:#ee7349;box-shadow:0 0 0 4px rgba(238,115,73,.18)}
  #fxb-gallery .fxb-gal-h2{font-weight:800;font-size:clamp(28px,4vw,46px);line-height:1.08;letter-spacing:-.02em}
  #fxb-gallery .fxb-gal-accent{position:relative;white-space:nowrap;color:var(--purple-2)}
  #fxb-gallery .fxb-gal-accent::after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.36em;background:#fcf951;z-index:-1;border-radius:6px;transform:rotate(-1.2deg)}
  #fxb-gallery .fxb-gal-sub{max-width:620px;color:var(--muted);font-size:17px;font-weight:500}
  /* Стекинг-карточки: карточки складываются колодой при скролле */
  #fxb-gallery .fxb-stack{--card-h:clamp(320px,58vh,560px);--stack-top:96px;--stack-step:26px;position:relative}
  #fxb-gallery .fxb-scard{position:relative;height:calc(var(--card-h) + 34vh)}
  #fxb-gallery .fxb-scard:last-child{height:calc(var(--card-h) + 4vh)}
  #fxb-gallery .fxb-scard:nth-child(1){--i:0}#fxb-gallery .fxb-scard:nth-child(2){--i:1}
  #fxb-gallery .fxb-scard:nth-child(3){--i:2}#fxb-gallery .fxb-scard:nth-child(4){--i:3}
  #fxb-gallery .fxb-scard:nth-child(5){--i:4}#fxb-gallery .fxb-scard:nth-child(6){--i:5}
  #fxb-gallery .fxb-scard:nth-child(7){--i:6}#fxb-gallery .fxb-scard:nth-child(8){--i:7}
  #fxb-gallery .fxb-scard:nth-child(9){--i:8}#fxb-gallery .fxb-scard:nth-child(10){--i:9}
  #fxb-gallery .fxb-sticky{position:sticky;top:calc(var(--stack-top) + var(--i,0)*var(--stack-step));transform-origin:center top;will-change:transform,filter}
  #fxb-gallery .fxb-frame{position:relative;height:var(--card-h);margin:0;border-radius:34px;overflow:hidden;cursor:pointer;background:#241a36;box-shadow:0 30px 70px -28px rgba(36,26,54,.55)}
  /* Фото показывается целиком (contain), поля заполнены размытой копией фото */
  #fxb-gallery .fxb-frame::before{content:"";position:absolute;inset:0;background-image:var(--ph);background-size:cover;background-position:center;filter:blur(28px) brightness(.65);transform:scale(1.25)}
  #fxb-gallery .fxb-frame img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
  #fxb-gallery .fxb-cap{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:18px;padding:30px 34px;background:linear-gradient(180deg,rgba(20,12,35,0) 0%,rgba(20,12,35,.82) 100%);color:#fff;pointer-events:none}
  #fxb-gallery .fxb-cap-num{font-weight:900;font-size:clamp(34px,5vw,58px);line-height:.85;letter-spacing:-.02em;background:linear-gradient(135deg,#fcf951,#ee7349);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #fxb-gallery .fxb-cap-pill{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;border:1.5px solid rgba(255,255,255,.55);border-radius:100px;padding:9px 18px;background:rgba(255,255,255,.08);white-space:nowrap;transition:background .25s}
  #fxb-gallery .fxb-frame:hover .fxb-cap-pill{background:rgba(255,255,255,.22)}

  /* Лайтбокс */
  #fxb-gallery .fxb-lightbox{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
  #fxb-gallery .fxb-lightbox.fxb-open{display:flex}
  #fxb-gallery .fxb-lb-bg{position:absolute;inset:0;background:rgba(36,26,54,.88);backdrop-filter:blur(6px)}
  #fxb-gallery .fxb-lb-close{position:absolute;top:20px;right:24px;z-index:2;background:rgba(255,255,255,.15);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1;cursor:pointer;transition:background .2s}
  #fxb-gallery .fxb-lb-close:hover{background:rgba(255,255,255,.3)}
  #fxb-gallery .fxb-lb-prev,#fxb-gallery .fxb-lb-next{position:absolute;top:50%;z-index:2;background:rgba(255,255,255,.15);color:#fff;border:0;width:50px;height:50px;border-radius:50%;font-size:32px;line-height:1;cursor:pointer;transform:translateY(-50%);transition:background .2s}
  #fxb-gallery .fxb-lb-prev{left:20px}
  #fxb-gallery .fxb-lb-next{right:20px}
  #fxb-gallery .fxb-lb-prev:hover,#fxb-gallery .fxb-lb-next:hover{background:rgba(255,255,255,.3)}
  #fxb-gallery .fxb-lb-img-wrap{position:relative;z-index:1;max-width:90vw;max-height:85vh}
  #fxb-gallery .fxb-lb-img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:fxblb .3s ease}
  @keyframes fxblb{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  @media(max-width:760px){
    #fxb-gallery .fxb-stack{--card-h:clamp(240px,52vh,420px);--stack-top:76px;--stack-step:16px}
    #fxb-gallery .fxb-scard{height:calc(var(--card-h) + 30vh)}
    #fxb-gallery .fxb-scard:last-child{height:calc(var(--card-h) + 4vh)}
    #fxb-gallery .fxb-frame{border-radius:22px}
    #fxb-gallery .fxb-cap{padding:18px 20px;gap:12px}
    #fxb-gallery .fxb-cap-pill{padding:7px 13px;font-size:11px}
  }
</style>

<script>
/* Инициализация вынесена в window.fxbGalleryInit — CMS-лоадер пересоздаёт
   карточки из LMS и вызывает её повторно (см. fxb-cms-loader ниже). */
window.fxbGalleryInit=function(){
  var root=document.getElementById('fxb-gallery');if(!root)return;

  /* === Стекинг: карточки складываются колодой, предыдущие уменьшаются === */
  var wraps=Array.prototype.slice.call(root.querySelectorAll('.fxb-scard'));
  var stickies=wraps.map(function(w){return w.querySelector('.fxb-sticky')});
  var N=wraps.length,tops=[];
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function update(){
    if(reduced||N<2)return;
    var vh=window.innerHeight;
    for(var i=0;i<N-1;i++){
      var nextTop=wraps[i+1].getBoundingClientRect().top;
      var rest=tops[i+1];
      var p=1-(nextTop-rest)/(vh-rest);
      p=Math.max(0,Math.min(1,p));
      var target=1-(N-1-i)*0.03;
      stickies[i].style.transform='scale('+(1-p*(1-target)).toFixed(4)+')';
      stickies[i].style.filter='brightness('+(1-p*0.22).toFixed(3)+')';
    }
  }
  function measure(){
    tops=stickies.map(function(s){var t=parseFloat(getComputedStyle(s).top);return isNaN(t)?0:t});
    update();
  }
  var tick=false;
  if(!window.__fxbGalleryBound){
    window.__fxbGalleryBound=true;
    window.addEventListener('scroll',function(){
      if(!tick){tick=true;requestAnimationFrame(function(){update();tick=false});}
    },{passive:true});
    window.addEventListener('resize',function(){if(window.fxbGalleryInit)window.fxbGalleryInit()});
  }
  measure();

  /* === Лайтбокс для просмотра фото ===
     Список фото и текущий индекс — на элементе lb: при пересоздании карточек
     CMS-лоадером кнопки prev/next (привязаны один раз) видят свежие src. */
  var lb=document.getElementById('fxbLightbox');
  var lbImg=lb.querySelector('.fxb-lb-img');
  var frames=root.querySelectorAll('.fxb-frame');
  var imgs=[];lb.__cur=0;
  frames.forEach(function(f,i){
    var img=f.querySelector('img');
    if(img){
      imgs.push(img.src);
      /* размытая подложка из того же фото — чтобы фото не обрезалось */
      f.style.setProperty('--ph','url("'+img.src+'")');
      f.addEventListener('click',function(){lb.__cur=i;openLb(lb.__imgs[lb.__cur])});
    }
  });
  lb.__imgs=imgs;
  function openLb(src){lbImg.src=src;lb.classList.add('fxb-open')}
  function closeLb(){lb.classList.remove('fxb-open');lbImg.src=''}
  if(!lb.dataset.fxbLbBound){
    lb.dataset.fxbLbBound='1';
    lb.querySelector('.fxb-lb-close').addEventListener('click',closeLb);
    lb.querySelector('.fxb-lb-bg').addEventListener('click',closeLb);
    lb.querySelector('.fxb-lb-prev').addEventListener('click',function(){var a=lb.__imgs||[];if(a.length){lb.__cur=(lb.__cur-1+a.length)%a.length;lbImg.src=a[lb.__cur]}});
    lb.querySelector('.fxb-lb-next').addEventListener('click',function(){var a=lb.__imgs||[];if(a.length){lb.__cur=(lb.__cur+1)%a.length;lbImg.src=a[lb.__cur]}});
  }
};
fxbGalleryInit();
</script>

<!-- ===== CMS-подхват фото галереи с LMS (read-only public API) ===== -->
<script>
(function(){
  /* Админка /admin/site (LMS) → Postgres → публичный JSON. При ошибке/пустом
     ответе остаётся статичная вёрстка. После перерисовки — fxbGalleryInit(). */
  var API=(function(){
    if(window.FXB_CMS_API)return window.FXB_CMS_API;
    var h=location.hostname;
    if(h==='localhost'||h==='127.0.0.1')return 'http://localhost:8765';
    return 'https://lms.dymova-english.ru';
  })();
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var gallery=document.getElementById('fxb-gallery');if(!gallery)return;
  fetch(API+'/api/v1/site/public/photos?group=gallery',{cache:'no-cache'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(photos){
      if(!photos||!photos.length)return;
      var stack=gallery.querySelector('.fxb-stack');if(!stack)return;
      var pill='<span class="fxb-cap-pill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Увеличить</span>';
      stack.innerHTML=photos.map(function(p,i){
        var num=('0'+(i+1)).slice(-2);
        return '<div class="fxb-scard"><div class="fxb-sticky"><figure class="fxb-frame">'
          +'<img src="'+esc(p.url)+'" alt="'+esc(p.alt)+'" loading="lazy" decoding="async">'
          +'<figcaption class="fxb-cap"><span class="fxb-cap-num">'+num+'</span>'+pill+'</figcaption>'
          +'</figure></div></div>';
      }).join('');
      if(window.fxbGalleryInit)window.fxbGalleryInit();
    })
    .catch(function(){/* фолбэк — статичная вёрстка */});
})();
</script>
