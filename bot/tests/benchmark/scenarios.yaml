# Бенчмарк разговоров: как бот обязан вести себя в типовых ситуациях.
#
# Сценарий — это последовательность реплик клиента и ожидания к ПОСЛЕДНЕМУ
# ответу бота. Универсальные требования (не молчать, не сыпать вопросами, не
# выдавать служебные маркеры, не восторгаться дежурными фразами) проверяются
# для каждого ответа автоматически и здесь не перечисляются.
#
# Ожидания:
#   no_offer      — не звать записываться/на диагностику
#   offer_ok      — предложение уместно (проверяется только отсутствие вреда)
#   asks          — в ответе есть уточняющий вопрос
#   no_leak       — ни слова из служебных инструкций
#   admin         — вопрос уходит человеку
#   mentions      — ответ содержит подстроку (список)
#   forbids       — ответ НЕ содержит подстроку (список)

