        - "Какие есть программы?"
        - "Ребёнку 7 лет"
        - "Вернёмся к программам"
      expect: []
    - id: long-repeat-question
      messages:
        - "Сколько стоит?"
        - "Сколько стоит?"
      expect: [no_repeat]
    - id: long-many-turns
      messages:
