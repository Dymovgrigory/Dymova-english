services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # ВРЕМЕННОЕ решение доступа к Telegram Bot API.
    #
    # Сеть сервера блокирует почти все IP Telegram: из проверенных
    # 149.154.166.110, 149.154.167.197, 149.154.171.5, 91.108.56.130 —
    # все BLOCKED, отвечает только 149.154.167.220. DNS при этом отдаёт
    # заблокированный 149.154.166.110, поэтому бот не мог подключиться
    # даже после фикса приоритета IPv4 (см. Dockerfile).
    #
    # TLS не страдает: SNI остаётся api.telegram.org, сертификат
    # проверяется штатно.
    #
    # Долгоживущее решение — рабочий egress (SOCKS-прокси или VPN) в
    # TELEGRAM_PROXY_URL: тогда эту строку нужно убрать. Пока прокси нет,
    # без пина Telegram-бот молчит.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # HTTPS-реверс-прокси: bot.dymova-english.ru -> bot:8000, автоматический
  # Let's Encrypt. Плюс отдаёт статику мигрируемого сайта на
  # new.dymova-english.ru (см. deploy/Caddyfile).
  #
  # dns: 8.8.8.8/1.1.1.1 — без этого контейнер наследует host-овский
  # /etc/resolv.conf с nameserver 127.0.0.53 (стаб systemd-resolved ХОСТА),
  # недостижимый изнутри контейнера — ACME-запросы к Let's Encrypt тогда
  # не резолвятся и сертификат не обновляется (было причиной реального
  # простоя бота, см. DEVLOG "Сессия 25").
  caddy:
    image: caddy:2
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # gbrain's memory/recall/swarm MCP services run as systemd units directly
    # on the host (not in Docker), listening on 127.0.0.1. From inside this
    # container, "127.0.0.1" is the container's own loopback, not the host's —
    # host.docker.internal + this extra_hosts entry is what lets the
    # mcp.dymova-english.ru block in Caddyfile reach them (see hermes-integration
    # setup in Dymova-english repo docs).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_config:/config
      - caddy_data:/data
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - /home/yc-user/foxinburg-site:/srv/foxinburg-site
    networks:
      - default
      # LMS-стек (lms-frontend/lms-backend) живёт в сети проекта foxinburg
      # (см. LMS/docker-compose.prod.yml). Подключаем Caddy к ней, чтобы
      # блок lms.dymova-english.ru в Caddyfile резолвил контейнеры по именам.
      - foxinburg_foxinburg

volumes:
  caddy_config:
  caddy_data:

networks:
  foxinburg_foxinburg:
    external: true
