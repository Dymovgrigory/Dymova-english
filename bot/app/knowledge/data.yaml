faq:
  - q: "До скольки и когда вы работаете? Какой режим работы?"
    a: "Ежедневно с 9:00 до 21:00, без выходных. Занятия идут утром, днём и вечером — подберём удобное время."
  - q: "Есть ли занятия в выходные?"
    a: "Да, школа работает без выходных, ежедневно с 9:00 до 21:00 — занятия можно подобрать и на субботу, и на воскресенье."
  - q: "Как до вас добраться? Какой транспорт?"
    a: "Оба филиала в Долгопрудном: пр-кт Лихачевский, 76к1 и пр-кт Ракетостроителей, 9к3. Точный маршрут удобнее всего построить в Яндекс.Картах: https://yandex.ru/maps/?text=Долгопрудный%2C%20проспект%20Лихачевский%2C%2076к1&rtt=auto и https://yandex.ru/maps/?text=Долгопрудный%2C%20проспект%20Ракетостроителей%2C%209к3&rtt=auto"
  - q: "Вы давно работаете?"
    a: "Работаем с 2020 года — больше 5 лет опыта в обучении детей. Официальная образовательная лицензия, аккредитованный центр международной олимпиады Hippo, рейтинг 5.0 на Яндекс.Картах."
  - q: "Что входит в абонемент?"
    a: "Больше, чем просто занятия: мини-группы до 7 человек, разговорный клуб с носителем языка, помощь со школьной домашкой по английскому по субботам, еженедельные видео-отчёты и мобильное приложение с играми и наградами."
  - q: "У вас есть носитель языка?"
    a: "Да! В офлайн-формат входит разговорный клуб с носителем языка — дети применяют английский в живом общении."
  - q: "Можно ли платить помесячно, а не за год?"
    a: "Да, конечно. Английский в мини-группе: 9 000 ₽/мес при ежемесячной оплате или 8 200 ₽/мес при оплате за учебный год. Малыши 2–3 года: 7 000 ₽/мес или 6 500 ₽/мес за год. Есть рассрочка и оплата маткапиталом."
  - q: "Есть ли индивидуальные занятия?"
    a: "Да, индивидуальные занятия — 2 500 ₽ за 60 минут. Персональная программа, удобное расписание, доступ в приложение."
  - q: "Есть ли занятия для совсем маленьких детей?"
    a: "Да, для малышей 2–3 лет есть группы раннего развития: 2 раза в неделю по 45 минут в игровой форме, 6 500–7 000 ₽/мес."
  - q: "Можно оплатить материнским капиталом или получить вычет?"
    a: "Да, принимаем оплату материнским капиталом (в том числе Летнюю Академию), а также можно оформить налоговый вычет 13% за обучение. Есть и рассрочка — подробности подскажет администратор."
  - q: "Как вы помогаете с домашкой?"
    a: "Два способа: на занятиях педагоги помогают со школьной домашкой по английскому, а ещё можно прислать фото задания прямо в чат или в мини-приложение — Фокси бесплатно объяснит решение."
  - q: "Я не уверена, понравится ли моему ребёнку?"
    a: "Приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой. Более 90% детей после пробного урока хотят продолжить."
  - q: "Мой ребёнок даже букв не знает. Как он будет заниматься, если всё на английском?"
    a: "Мы работаем с нулевого уровня. Педагоги используют игровую методику, TPR и визуальные материалы — ребёнок начинает понимать и говорить естественно, как осваивал родной язык."
  - q: "Ваша программа совпадает со школьной? Ребёнок не запутается?"
    a: "Наша программа дополняет школьную и идёт глубже. Мы развиваем все четыре навыка, поэтому дети чувствуют себя увереннее и в школе."
  - q: "Как проходят занятия?"
    a: "В мини-группах до 7 человек. Каждый урок: разговорная практика, игровые активности, работа с материалами и закрепление через приложение. Длительность 45–60 минут."
  - q: "Сколько раз в неделю проходят занятия?"
    a: "2 раза в неделю по 60 минут. Есть утренние, дневные и вечерние группы."
  - q: "Как оплачиваются занятия?"
    a: "Помесячно или за семестр (со скидкой). Принимаем карты, переводы и маткапитал. Подробности — у администратора."
  - q: "Задаёте ли вы домашние задания? Я не знаю языка."
    a: "Домашние задания выполняются через мобильное приложение в игровом формате с подсказками — помощь родителей не требуется."
  - q: "Как я пойму, что у ребёнка есть результат?"
    a: "Еженедельные видео-отчёты, отчёты об уроке, открытые уроки и регулярные тестирования с обратной связью."
  - q: "Как вы обучаете чтению?"
    a: "Методом фониксов (Phonics): ребёнок учится читать через звуки, а не через зубрёжку букв. Дети начинают читать уже через несколько месяцев."
  - q: "Сколько времени нужно, чтобы ребёнок заговорил на английском?"
    a: "Уже с первых занятий дети учатся говорить простыми фразами. Устойчивое свободное владение формируется за несколько лет регулярных занятий — зависит от возраста, частоты занятий и вовлечённости ребёнка."
  - q: "Почему вы не переводите слова на русский?"
    a: "Мы учим детей думать по-английски: через визуальные образы, действия и контекст язык запоминается естественно, как родной. Постоянный перевод формирует привычку сначала думать по-русски — именно она потом создаёт языковой барьер. В приложении перевод есть, но только чтобы закрепить точное значение слова вне урока."
  - q: "А грамматику вы проходите?"
    a: "Да, но без скучных правил и таблиц — через контекст, картинки и жизненные ситуации. Например, Present Continuous показываем через то, что происходит прямо сейчас. Цель — чтобы ребёнок сначала научился использовать грамматику в речи, а правила пришли следом."
  - q: "Вы много играете — это обучение или развлечение?"
    a: "Игра — основной инструмент обучения, а не развлечение: мы моделируем реальные ситуации (магазин, ресторан, врач), через игру отрабатываем грамматику и лексику. Каждый урок даёт минимум 5-10 новых слов в активной речи и заканчивается измеримым «продуктом урока»."
  - q: "Как я могу помочь ребёнку дома, если сам не знаю английского?"
    a: "Достаточно поддерживать интерес: вместе слушайте песни, смотрите мультфильмы, хвалите даже за маленькие успехи. Домашние задания ребёнок выполняет самостоятельно в приложении. А со школьной домашкой по английскому помогут наши педагоги — бесплатно."
  - q: "Ребёнок стесняется и не хочет идти на урок — это нормально?"
    a: "Да, на старте это нормально: мы не давим и даём время адаптироваться — обычно дети раскрепощаются за 2-3 занятия. Если стеснение сохраняется дольше, разбираемся в причинах вместе с методистом."
  - q: "Выдаёте ли вы сертификаты?"
    a: "Да, в конце учебного года дети получают сертификат при посещении не менее 85% занятий. Прогресс отслеживаем по международной шкале уровней — в комфортном темпе, без давления."
  - q: "Сможет ли ребёнок сдать международный экзамен?"
    a: "Да, мы готовим к экзаменам Cambridge (Starters, Movers, Flyers) — подготовка встроена в обычный процесс обучения, без дополнительного стресса. В России эти экзамены сейчас не сдаются, поэтому уровень подтверждаем внутренним тестированием в экзаменационном формате; при цели сдать за рубежом — готовим и к этому."
  - q: "Как вы оцениваете прогресс ребёнка?"
    a: "Ежемесячные развёрнутые письменные отчёты с конкретными фактами о вашем ребёнке, мини-отчёты в игровой форме, видео с примерами речи и открытые уроки три раза в год, где вы видите прогресс своими глазами. Плюс ежемесячные тесты в формате кембриджских экзаменов."
  - q: "Сколько занятий в неделю нужно для результата?"
    a: "Оптимально — 2-3 занятия в неделю. Одного занятия тоже достаточно при регулярности, но прогресс будет медленнее. Главное — стабильность, а не количество."
  - q: "Можно ли начинать учить язык с 3-4 лет? Не рано?"
    a: "Да, можно и нужно: в этом возрасте язык усваивается почти как родной — важно создать языковую среду. Мы работаем через игру, движение и визуальные образы в комфортном темпе, без грамматики и зубрёжки."
  - q: "Ребёнок ничего не рассказывает после урока — значит, не понял материал?"
    a: "Не обязательно. Малыши часто не умеют пересказывать происходящее, но со временем вы начнёте слышать английские фразы в быту и играх — это лучший показатель. Старшие дети нередко просто стесняются говорить на языке при родителях."
  - q: "Что если ребёнок пропустил занятия?"
    a: "Ничего страшного — ключевые темы регулярно повторяются. Пропущенное занятие можно отработать в другой подходящей по уровню группе, плюс доступны видео-уроки в записи."
  - q: "Как вы мотивируете детей заниматься?"
    a: "Через интерес, а не давление: геймификация в приложении «Твоя школа» (монетки за активность, которые обмениваются на подарки), рейтинги, конкурс «Лучший студент FOXINBURG» с призом по итогам года. Формула школы: интерес равно мотивация."
  - q: "У ребёнка был негативный опыт со школьным английским, он боится. Поможете?"
    a: "Да. У нас не ругают за ошибки и не ставят оценок, ошибки исправляют мягко — перефразируя, а не указывая. Ребёнок получает новый, позитивный опыт без давления — так восстанавливаются доверие и интерес к языку."
  - q: "Чем групповые занятия отличаются от репетитора?"
    a: "Мы не просто объясняем правила, а погружаем в язык: говорение, игра, работа в парах, групповая динамика — то, что особенно хорошо работает с детьми. Плюс штатный методист контролирует качество, есть приложение и прозрачная отчётность — чего у репетитора обычно нет."
  - q: "Можно ли начать заниматься в середине учебного года?"
    a: "Да, конечно — проведём диагностику и подберём подходящую по уровню группу."
  - q: "Можно ли наблюдать за уроком?"
    a: "Да: для младших групп в кабинете есть камеры — родитель наблюдает из холла, а если ребёнок стесняется, может присутствовать на занятии. Для старших — место рядом с открытой дверью или подключение по видеосвязи. Также готовим видео-отчёты."
  - q: "У ребёнка логопедические особенности или ЗПР — можно ли к вам?"
    a: "Да, мы адаптируем подход и создаём комфортную среду с учётом особенностей ребёнка. Часто изучение английского, наоборот, помогает развить речь и уверенность."
  - q: "Ребёнок не будет путать русские и английские слова?"
    a: "Нет, это естественный этап освоения двух языков — со временем мозг учится свободно переключаться между ними. В нашей практике нет ни одного ученика, который бы устойчиво путал языки."
  - q: "Сколько детей в группе?"
    a: "До 6-8 человек (без учёта детей на отработке пропущенных занятий) — так педагог уделяет внимание каждому."
  - q: "Вы учите алфавит?"
    a: "Начинаем с фоникса — звуков, а не букв: сначала дети учатся читать по звукам, затем осваивают сложные буквосочетания. Так снимаются типичные трудности с чтением: к концу учебного года дети читают целые предложения."
  - q: "У меня нет времени делать с ребёнком домашнее задание — это проблема?"
    a: "Нет: задания рассчитаны на самостоятельное выполнение ребёнком в приложении. А со школьной домашкой по английскому наши педагоги помогают бесплатно — можно заранее прислать задание или подойти к педагогу перед уроком."

promos:
  - "Бесплатная диагностика знаний до начала обучения."
  - "Скидка при оплате за учебный год — стоимость от 8 200 ₽/мес."
  - "Утренние группы для тех, кто учится во вторую смену."

objections:
  - key: "дорого"
    response: >
      Понимаю, цена важна. У нас есть удобные варианты: оплата за учебный год
      снижает стоимость до 8 200 ₽/мес, есть рассрочка и оплата маткапиталом.
      А начать можно с бесплатной диагностики и пробного урока, чтобы убедиться
      в результате до оплаты.
  - key: "подумаю"
    response: >
      Конечно! Чтобы вам было проще решить, предлагаю записаться на бесплатную
      диагностику — это ни к чему не обязывает, но вы увидите уровень ребёнка
      и познакомитесь с педагогом. Подобрать удобное время?
  - key: "далеко"
    response: >
      У нас два филиала в Долгопрудном (Лихачевский 76к1 и Ракетостроителей 9к3),
      а также онлайн-формат из любой точки. Подскажите, какой район удобнее —
      подберу ближайший вариант.
  - key: "попозже"
    response: >
      Понимаю, хочется отложить. Обычно дети входят в язык легче именно в
      раннем возрасте — он усваивается почти как родной, а позже подключается
      школьная нагрузка. Предлагаю не решение «здесь и сейчас», а бесплатную
      диагностику: вы увидите уровень ребёнка и спокойно решите, когда стартовать.
  - key: "не хочет"
    response: >
      Это частая ситуация, и чаще всего дело не в языке, а в том, что ребёнок
      ещё не попробовал наш формат. У нас обучение идёт через игру и погружение,
      без оценок и давления — дети обычно раскрепощаются за 2-3 занятия.
      Подскажите, а ему не нравится сам английский или он вообще не любит
      дополнительные занятия?
  - key: "расписание"
    response: >
      Понимаю, логистика важна. У нас группы идут утром, днём и вечером,
      включая выходные, два филиала плюс онлайн — почти всегда находится
      удобный слот. Подскажите, какие дни и время вам подходят, и я посмотрю
      варианты.
  - key: "рано"
    response: >
      На самом деле ранний возраст — самое благодарное время для языка: он
      усваивается естественно, через игру и звучание, без зубрёжки. К школе
      ребёнок приходит уже со слухом и базой, и программа даётся заметно
      легче. Можно начать с бесплатной диагностики — посмотрите, как ребёнок
      отреагирует, и решите спокойно.

