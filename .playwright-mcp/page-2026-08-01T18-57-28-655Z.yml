  - generic [ref=f93e550]:
    - generic [ref=f93e551]:
      - generic [ref=f93e552]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f93e554]
      - paragraph [ref=f93e555]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f93e556]:
      - tab "Письменные" [ref=f93e557] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f93e558] [cursor=pointer]
    - generic [ref=f93e560]:
      - article [ref=f93e561]:
        - generic "5 из 5" [ref=f93e562]
        - paragraph [ref=f93e573]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f93e574]:
          - generic [ref=f93e575]: А
          - generic [ref=f93e576]:
            - strong [ref=f93e577]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f93e578]:
        - generic "5 из 5" [ref=f93e579]
        - paragraph [ref=f93e590]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f93e591]:
          - generic [ref=f93e592]: Е
          - generic [ref=f93e593]:
            - strong [ref=f93e594]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f93e595]:
        - generic "5 из 5" [ref=f93e596]
        - paragraph [ref=f93e607]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f93e608]:
          - generic [ref=f93e609]: О
          - generic [ref=f93e610]:
            - strong [ref=f93e611]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f93e612]:
        - generic "5 из 5" [ref=f93e613]
        - paragraph [ref=f93e624]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f93e625]:
          - generic [ref=f93e626]: М
          - generic [ref=f93e627]:
            - strong [ref=f93e628]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f93e629]:
        - generic "5 из 5" [ref=f93e630]
        - paragraph [ref=f93e641]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f93e642]:
          - generic [ref=f93e643]: Н
          - generic [ref=f93e644]:
            - strong [ref=f93e645]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f93e646]:
        - generic "5 из 5" [ref=f93e647]
        - paragraph [ref=f93e658]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f93e659]:
          - generic [ref=f93e660]: И
          - generic [ref=f93e661]:
            - strong [ref=f93e662]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f93e664] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f93e666]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f93e667]
    - paragraph [ref=f93e668]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f93e669]:
      - generic [ref=f93e670]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f93e671] [cursor=pointer]
        - paragraph [ref=f93e675]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f93e676]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f93e677] [cursor=pointer]
        - paragraph [ref=f93e681]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f93e682]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f93e683] [cursor=pointer]
        - paragraph [ref=f93e687]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f93e688]:
        - button "Как проходят занятия?" [ref=f93e689] [cursor=pointer]
        - paragraph [ref=f93e693]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f93e694]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f93e695] [cursor=pointer]
        - paragraph [ref=f93e699]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f93e700]:
        - button "Как оплачиваются занятия?" [ref=f93e701] [cursor=pointer]
        - paragraph [ref=f93e705]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f93e706]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f93e707] [cursor=pointer]
        - paragraph [ref=f93e711]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f93e712]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f93e713] [cursor=pointer]
        - paragraph [ref=f93e717]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f93e718]:
        - button "Как вы обучаете чтению?" [ref=f93e719] [cursor=pointer]
        - paragraph [ref=f93e723]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
