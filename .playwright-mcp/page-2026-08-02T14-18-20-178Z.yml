            - paragraph [ref=f48e897]: Дочь второй год посещает Фокси Фокс, с радостью ходит на занятия. В выходные посещает английский клуб, где происходит общение с носителем языка. Очень нравится, что домашние задания есть не только в тетради, но и в приложении. Также в приложении можно отследить успехи и посещение ребенка,что в нашей жизни очень актуально. Вообще мне нравится семейная и дружелюбная обстановка в этой школе, с удовольствием рекомендую ее всем…
