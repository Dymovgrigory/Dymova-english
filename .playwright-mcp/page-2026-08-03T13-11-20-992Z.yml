              - generic [ref=f7e991]: Яндекс Карты
            - paragraph [ref=f7e992]: Прекрасные преподаватели с отличной методикой развития языка. Давно занимаемся в этой школе и прогресс очень хорошо заметен. Занимались как очно, так и онлайн - в любом формате преподаватели умеют увлечь и заинтересовать детей. Ну и много активностей и мероприятий. У нашей дочки любимый - это хэллоуин, ходим постоянно :)
