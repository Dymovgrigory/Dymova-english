              - generic [ref=f7e919]:
                - strong [ref=f7e920]: Надежда Надежда
                - text: 20 октября 2025 · филиал Ракетостроителей, 9к3
          - article [ref=f7e921]:
            - generic [ref=f7e922]:
              - generic "Оценка 5 из 5" [ref=f7e923]
              - generic [ref=f7e934]: Яндекс Карты
            - paragraph [ref=f7e935]: Английский клуб FoxyFox. Мой младший сын и старший ходят сюда второй год. Есть возможность офлайн и онлайн обучения. Ребенок идет на занятия с удовольствием, очень любит свою учительницу Елизавету. Летом на каникулах занимались онлайн прямо на даче. Уроки очень интересные, дети на уроках рисуют, поют, обучение проходит в игровой форме. Обучающие материалы-красочные, легко воспринимаются, не скучные. Рекомендую! 🌸
            - generic [ref=f7e936]:
              - generic [ref=f7e937]: "N"
              - generic [ref=f7e938]:
                - strong [ref=f7e939]: Nadin
                - text: 11 апреля 2025 · филиал Ракетостроителей, 9к3
          - article [ref=f7e940]:
            - generic [ref=f7e941]:
              - generic "Оценка 5 из 5" [ref=f7e942]
              - generic [ref=f7e953]: Яндекс Карты
            - paragraph [ref=f7e954]: Дети ходят в ФоксиФокс(возле 11 школы). За первый месяц реально отпали проблемы с домашкой по английскому в школе. Учитель всегда просит, если есть вопросы по школьному материалу, обращаться, не стесняться. Каждый раз дает обратную связь. Приложение, с покупкой призов за баллы тоже очень мотивирующая вещь. В общем молодцы, так держать. Уже записала детвору на будущий год. Знакомым советую, с чистой совестью.
            - generic [ref=f7e955]:
              - generic [ref=f7e956]: Н
              - generic [ref=f7e957]:
                - strong [ref=f7e958]: Наталия К.
                - text: 3 июня · филиал Лихачёвский, 76к1
          - article [ref=f7e959]:
            - generic [ref=f7e960]:
              - generic "Оценка 5 из 5" [ref=f7e961]
              - generic [ref=f7e972]: Яндекс Карты
            - paragraph [ref=f7e973]: Дочке нравится ходить на занятия в Foxy. Очень радуют поощрения в виде монеток, на которые можно потом что-нибудь купить. В классе немного учеников, что позволяет учителю уделять внимание каждому учащемуся. Для нас это было важно при выборе дополнительных занятий. Со слов дочки, атмосфера в классе дружелюбная, легкая и комфортная. Спасибо за позитивное отношение к детям! 🦊
