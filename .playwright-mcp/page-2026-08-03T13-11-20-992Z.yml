            - paragraph [ref=f7e590]: Хочу сказать огромное спасибо всем кто работает в Фокси Фокс и конечно в первую очередь нашим преподавателям!Они замечательные, талантливые, добрые, умные! У меня в Фокси Фокс ходит двое детей и обоим безумно нравится туда ходить!Для меня как для родителя это безумно важно чтобы у детей был интерес к занятиям, чтобы горели глаза когда бегут на занятия, чтобы не приходилось заставлять выполнять домашку! И Фокси Фокс в этом…
