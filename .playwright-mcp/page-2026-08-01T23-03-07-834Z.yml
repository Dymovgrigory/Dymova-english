  - generic [ref=f267e546]:
    - generic [ref=f267e547]:
      - generic [ref=f267e548]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f267e550]
      - paragraph [ref=f267e551]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f267e552]:
      - tab "Письменные" [ref=f267e553] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f267e554] [cursor=pointer]
    - generic [ref=f267e556]:
      - article [ref=f267e557]:
        - generic "5 из 5" [ref=f267e558]
        - paragraph [ref=f267e569]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f267e570]:
          - generic [ref=f267e571]: А
          - generic [ref=f267e572]:
            - strong [ref=f267e573]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f267e574]:
        - generic "5 из 5" [ref=f267e575]
        - paragraph [ref=f267e586]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f267e587]:
          - generic [ref=f267e588]: Е
          - generic [ref=f267e589]:
            - strong [ref=f267e590]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f267e591]:
        - generic "5 из 5" [ref=f267e592]
        - paragraph [ref=f267e603]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f267e604]:
          - generic [ref=f267e605]: О
          - generic [ref=f267e606]:
            - strong [ref=f267e607]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f267e608]:
        - generic "5 из 5" [ref=f267e609]
        - paragraph [ref=f267e620]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f267e621]:
          - generic [ref=f267e622]: М
          - generic [ref=f267e623]:
            - strong [ref=f267e624]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f267e625]:
        - generic "5 из 5" [ref=f267e626]
        - paragraph [ref=f267e637]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f267e638]:
          - generic [ref=f267e639]: Н
          - generic [ref=f267e640]:
            - strong [ref=f267e641]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f267e642]:
        - generic "5 из 5" [ref=f267e643]
        - paragraph [ref=f267e654]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f267e655]:
          - generic [ref=f267e656]: И
          - generic [ref=f267e657]:
            - strong [ref=f267e658]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f267e660] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f267e662]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f267e663]
    - paragraph [ref=f267e664]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f267e665]:
      - generic [ref=f267e666]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f267e667] [cursor=pointer]
        - paragraph [ref=f267e671]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f267e672]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f267e673] [cursor=pointer]
        - paragraph [ref=f267e677]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f267e678]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f267e679] [cursor=pointer]
        - paragraph [ref=f267e683]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f267e684]:
        - button "Как проходят занятия?" [ref=f267e685] [cursor=pointer]
        - paragraph [ref=f267e689]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f267e690]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f267e691] [cursor=pointer]
        - paragraph [ref=f267e695]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f267e696]:
        - button "Как оплачиваются занятия?" [ref=f267e697] [cursor=pointer]
        - paragraph [ref=f267e701]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f267e702]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f267e703] [cursor=pointer]
        - paragraph [ref=f267e707]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f267e708]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f267e709] [cursor=pointer]
        - paragraph [ref=f267e713]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f267e714]:
        - button "Как вы обучаете чтению?" [ref=f267e715] [cursor=pointer]
        - paragraph [ref=f267e719]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
