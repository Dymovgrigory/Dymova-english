  - generic [ref=e684]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=e685]
    - paragraph [ref=e686]: Ответы на самые популярные вопросы от родителей
    - generic [ref=e687]:
      - generic [ref=e688]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=e689] [cursor=pointer]
        - paragraph [ref=e693]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=e694]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=e695] [cursor=pointer]
        - paragraph [ref=e699]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=e700]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=e701] [cursor=pointer]
        - paragraph [ref=e705]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=e706]:
        - button "Как проходят занятия?" [ref=e707] [cursor=pointer]
        - paragraph [ref=e711]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=e712]:
        - button "Сколько раз в неделю проходят занятия?" [ref=e713] [cursor=pointer]
        - paragraph [ref=e717]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=e718]:
        - button "Как оплачиваются занятия?" [ref=e719] [cursor=pointer]
        - paragraph [ref=e723]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=e724]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=e725] [cursor=pointer]
        - paragraph [ref=e729]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=e730]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=e731] [cursor=pointer]
        - paragraph [ref=e735]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=e736]:
        - button "Как вы обучаете чтению?" [ref=e737] [cursor=pointer]
        - paragraph [ref=e741]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
