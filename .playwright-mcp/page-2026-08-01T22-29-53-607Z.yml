  - generic [ref=f231e525]:
    - generic [ref=f231e526]:
      - generic [ref=f231e527]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f231e529]
      - paragraph [ref=f231e530]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f231e531]:
      - tab "Письменные" [ref=f231e532] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f231e533] [cursor=pointer]
    - generic [ref=f231e535]:
      - article [ref=f231e536]:
        - generic "5 из 5" [ref=f231e537]
        - paragraph [ref=f231e548]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f231e549]:
          - generic [ref=f231e550]: А
          - generic [ref=f231e551]:
            - strong [ref=f231e552]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f231e553]:
        - generic "5 из 5" [ref=f231e554]
        - paragraph [ref=f231e565]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f231e566]:
          - generic [ref=f231e567]: Е
          - generic [ref=f231e568]:
            - strong [ref=f231e569]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f231e570]:
        - generic "5 из 5" [ref=f231e571]
        - paragraph [ref=f231e582]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f231e583]:
          - generic [ref=f231e584]: О
          - generic [ref=f231e585]:
            - strong [ref=f231e586]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f231e587]:
        - generic "5 из 5" [ref=f231e588]
        - paragraph [ref=f231e599]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f231e600]:
          - generic [ref=f231e601]: М
          - generic [ref=f231e602]:
            - strong [ref=f231e603]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f231e604]:
        - generic "5 из 5" [ref=f231e605]
        - paragraph [ref=f231e616]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f231e617]:
          - generic [ref=f231e618]: Н
          - generic [ref=f231e619]:
            - strong [ref=f231e620]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f231e621]:
        - generic "5 из 5" [ref=f231e622]
        - paragraph [ref=f231e633]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f231e634]:
          - generic [ref=f231e635]: И
          - generic [ref=f231e636]:
            - strong [ref=f231e637]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f231e639] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f231e641]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f231e642]
    - paragraph [ref=f231e643]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f231e644]:
      - generic [ref=f231e645]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f231e646] [cursor=pointer]
        - paragraph [ref=f231e650]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f231e651]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f231e652] [cursor=pointer]
        - paragraph [ref=f231e656]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f231e657]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f231e658] [cursor=pointer]
        - paragraph [ref=f231e662]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f231e663]:
        - button "Как проходят занятия?" [ref=f231e664] [cursor=pointer]
        - paragraph [ref=f231e668]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f231e669]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f231e670] [cursor=pointer]
        - paragraph [ref=f231e674]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f231e675]:
        - button "Как оплачиваются занятия?" [ref=f231e676] [cursor=pointer]
        - paragraph [ref=f231e680]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f231e681]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f231e682] [cursor=pointer]
        - paragraph [ref=f231e686]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f231e687]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f231e688] [cursor=pointer]
        - paragraph [ref=f231e692]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f231e693]:
        - button "Как вы обучаете чтению?" [ref=f231e694] [cursor=pointer]
        - paragraph [ref=f231e698]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
