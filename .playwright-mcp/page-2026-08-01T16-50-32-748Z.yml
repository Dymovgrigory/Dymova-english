  - generic [ref=f16e568]:
    - generic [ref=f16e569]:
      - generic [ref=f16e570]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f16e572]
      - paragraph [ref=f16e573]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f16e574]:
      - tab "Письменные" [ref=f16e575] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f16e576] [cursor=pointer]
    - generic [ref=f16e578]:
      - article [ref=f16e579]:
        - generic "5 из 5" [ref=f16e580]
        - paragraph [ref=f16e591]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f16e592]:
          - generic [ref=f16e593]: А
          - generic [ref=f16e594]:
            - strong [ref=f16e595]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f16e596]:
        - generic "5 из 5" [ref=f16e597]
        - paragraph [ref=f16e608]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f16e609]:
          - generic [ref=f16e610]: Е
          - generic [ref=f16e611]:
            - strong [ref=f16e612]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f16e613]:
        - generic "5 из 5" [ref=f16e614]
        - paragraph [ref=f16e625]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f16e626]:
          - generic [ref=f16e627]: О
          - generic [ref=f16e628]:
            - strong [ref=f16e629]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f16e630]:
        - generic "5 из 5" [ref=f16e631]
        - paragraph [ref=f16e642]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f16e643]:
          - generic [ref=f16e644]: М
          - generic [ref=f16e645]:
            - strong [ref=f16e646]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f16e647]:
        - generic "5 из 5" [ref=f16e648]
        - paragraph [ref=f16e659]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f16e660]:
          - generic [ref=f16e661]: Н
          - generic [ref=f16e662]:
            - strong [ref=f16e663]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f16e664]:
        - generic "5 из 5" [ref=f16e665]
        - paragraph [ref=f16e676]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f16e677]:
          - generic [ref=f16e678]: И
          - generic [ref=f16e679]:
            - strong [ref=f16e680]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f16e682] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f16e684]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f16e685]
    - paragraph [ref=f16e686]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f16e687]:
      - generic [ref=f16e688]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f16e689] [cursor=pointer]
        - paragraph [ref=f16e693]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f16e694]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f16e695] [cursor=pointer]
        - paragraph [ref=f16e699]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f16e700]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f16e701] [cursor=pointer]
        - paragraph [ref=f16e705]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f16e706]:
        - button "Как проходят занятия?" [ref=f16e707] [cursor=pointer]
        - paragraph [ref=f16e711]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f16e712]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f16e713] [cursor=pointer]
        - paragraph [ref=f16e717]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f16e718]:
        - button "Как оплачиваются занятия?" [ref=f16e719] [cursor=pointer]
        - paragraph [ref=f16e723]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f16e724]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f16e725] [cursor=pointer]
        - paragraph [ref=f16e729]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f16e730]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f16e731] [cursor=pointer]
        - paragraph [ref=f16e735]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f16e736]:
        - button "Как вы обучаете чтению?" [ref=f16e737] [cursor=pointer]
        - paragraph [ref=f16e741]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
