  - generic [ref=f12e532]:
    - generic [ref=f12e533]:
      - generic [ref=f12e534]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f12e536]
      - paragraph [ref=f12e537]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f12e538]:
      - tab "Письменные" [ref=f12e539] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f12e540] [cursor=pointer]
    - generic [ref=f12e542]:
      - article [ref=f12e543]:
        - generic "5 из 5" [ref=f12e544]
        - paragraph [ref=f12e555]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f12e556]:
          - generic [ref=f12e557]: А
          - generic [ref=f12e558]:
            - strong [ref=f12e559]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f12e560]:
        - generic "5 из 5" [ref=f12e561]
        - paragraph [ref=f12e572]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f12e573]:
          - generic [ref=f12e574]: Е
          - generic [ref=f12e575]:
            - strong [ref=f12e576]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f12e577]:
        - generic "5 из 5" [ref=f12e578]
        - paragraph [ref=f12e589]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f12e590]:
          - generic [ref=f12e591]: О
          - generic [ref=f12e592]:
            - strong [ref=f12e593]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f12e594]:
        - generic "5 из 5" [ref=f12e595]
        - paragraph [ref=f12e606]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f12e607]:
          - generic [ref=f12e608]: М
          - generic [ref=f12e609]:
            - strong [ref=f12e610]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f12e611]:
        - generic "5 из 5" [ref=f12e612]
        - paragraph [ref=f12e623]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f12e624]:
          - generic [ref=f12e625]: Н
          - generic [ref=f12e626]:
            - strong [ref=f12e627]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f12e628]:
        - generic "5 из 5" [ref=f12e629]
        - paragraph [ref=f12e640]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f12e641]:
          - generic [ref=f12e642]: И
          - generic [ref=f12e643]:
            - strong [ref=f12e644]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f12e646] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f12e648]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f12e649]
    - paragraph [ref=f12e650]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f12e651]:
      - generic [ref=f12e652]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f12e653] [cursor=pointer]
        - paragraph [ref=f12e657]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f12e658]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f12e659] [cursor=pointer]
        - paragraph [ref=f12e663]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f12e664]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f12e665] [cursor=pointer]
        - paragraph [ref=f12e669]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f12e670]:
        - button "Как проходят занятия?" [ref=f12e671] [cursor=pointer]
        - paragraph [ref=f12e675]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f12e676]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f12e677] [cursor=pointer]
        - paragraph [ref=f12e681]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f12e682]:
        - button "Как оплачиваются занятия?" [ref=f12e683] [cursor=pointer]
        - paragraph [ref=f12e687]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f12e688]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f12e689] [cursor=pointer]
        - paragraph [ref=f12e693]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f12e694]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f12e695] [cursor=pointer]
        - paragraph [ref=f12e699]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f12e700]:
        - button "Как вы обучаете чтению?" [ref=f12e701] [cursor=pointer]
        - paragraph [ref=f12e705]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
