  - generic [ref=f143e525]:
    - generic [ref=f143e526]:
      - generic [ref=f143e527]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f143e529]
      - paragraph [ref=f143e530]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f143e531]:
      - tab "Письменные" [ref=f143e532] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f143e533] [cursor=pointer]
    - generic [ref=f143e535]:
      - article [ref=f143e536]:
        - generic "5 из 5" [ref=f143e537]
        - paragraph [ref=f143e548]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f143e549]:
          - generic [ref=f143e550]: А
          - generic [ref=f143e551]:
            - strong [ref=f143e552]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f143e553]:
        - generic "5 из 5" [ref=f143e554]
        - paragraph [ref=f143e565]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f143e566]:
          - generic [ref=f143e567]: Е
          - generic [ref=f143e568]:
            - strong [ref=f143e569]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f143e570]:
        - generic "5 из 5" [ref=f143e571]
        - paragraph [ref=f143e582]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f143e583]:
          - generic [ref=f143e584]: О
          - generic [ref=f143e585]:
            - strong [ref=f143e586]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f143e587]:
        - generic "5 из 5" [ref=f143e588]
        - paragraph [ref=f143e599]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f143e600]:
          - generic [ref=f143e601]: М
          - generic [ref=f143e602]:
            - strong [ref=f143e603]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f143e604]:
        - generic "5 из 5" [ref=f143e605]
        - paragraph [ref=f143e616]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f143e617]:
          - generic [ref=f143e618]: Н
          - generic [ref=f143e619]:
            - strong [ref=f143e620]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f143e621]:
        - generic "5 из 5" [ref=f143e622]
        - paragraph [ref=f143e633]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f143e634]:
          - generic [ref=f143e635]: И
          - generic [ref=f143e636]:
            - strong [ref=f143e637]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f143e639] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f143e641]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f143e642]
    - paragraph [ref=f143e643]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f143e644]:
      - generic [ref=f143e645]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f143e646] [cursor=pointer]
        - paragraph [ref=f143e650]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f143e651]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f143e652] [cursor=pointer]
        - paragraph [ref=f143e656]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f143e657]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f143e658] [cursor=pointer]
        - paragraph [ref=f143e662]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f143e663]:
        - button "Как проходят занятия?" [ref=f143e664] [cursor=pointer]
        - paragraph [ref=f143e668]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f143e669]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f143e670] [cursor=pointer]
        - paragraph [ref=f143e674]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f143e675]:
        - button "Как оплачиваются занятия?" [ref=f143e676] [cursor=pointer]
        - paragraph [ref=f143e680]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f143e681]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f143e682] [cursor=pointer]
        - paragraph [ref=f143e686]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f143e687]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f143e688] [cursor=pointer]
        - paragraph [ref=f143e692]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f143e693]:
        - button "Как вы обучаете чтению?" [ref=f143e694] [cursor=pointer]
        - paragraph [ref=f143e698]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
