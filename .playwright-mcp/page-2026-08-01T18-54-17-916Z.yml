  - generic [ref=f63e666]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f63e667]
    - paragraph [ref=f63e668]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f63e669]:
      - generic [ref=f63e670]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f63e671] [cursor=pointer]
        - paragraph [ref=f63e675]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f63e676]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f63e677] [cursor=pointer]
        - paragraph [ref=f63e681]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f63e682]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f63e683] [cursor=pointer]
        - paragraph [ref=f63e687]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f63e688]:
        - button "Как проходят занятия?" [ref=f63e689] [cursor=pointer]
        - paragraph [ref=f63e693]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f63e694]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f63e695] [cursor=pointer]
        - paragraph [ref=f63e699]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f63e700]:
        - button "Как оплачиваются занятия?" [ref=f63e701] [cursor=pointer]
        - paragraph [ref=f63e705]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f63e706]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f63e707] [cursor=pointer]
        - paragraph [ref=f63e711]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f63e712]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f63e713] [cursor=pointer]
        - paragraph [ref=f63e717]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f63e718]:
        - button "Как вы обучаете чтению?" [ref=f63e719] [cursor=pointer]
        - paragraph [ref=f63e723]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
