    - generic [ref=f63e551]:
      - generic [ref=f63e552]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f63e554]
      - paragraph [ref=f63e555]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f63e556]:
      - tab "Письменные" [ref=f63e557] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f63e558] [cursor=pointer]
    - generic [ref=f63e560]:
      - article [ref=f63e561]:
        - generic "5 из 5" [ref=f63e562]
        - paragraph [ref=f63e573]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f63e574]:
          - generic [ref=f63e575]: А
          - generic [ref=f63e576]:
            - strong [ref=f63e577]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f63e578]:
        - generic "5 из 5" [ref=f63e579]
        - paragraph [ref=f63e590]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f63e591]:
          - generic [ref=f63e592]: Е
          - generic [ref=f63e593]:
            - strong [ref=f63e594]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f63e595]:
        - generic "5 из 5" [ref=f63e596]
        - paragraph [ref=f63e607]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f63e608]:
          - generic [ref=f63e609]: О
          - generic [ref=f63e610]:
            - strong [ref=f63e611]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f63e612]:
        - generic "5 из 5" [ref=f63e613]
        - paragraph [ref=f63e624]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f63e625]:
          - generic [ref=f63e626]: М
          - generic [ref=f63e627]:
            - strong [ref=f63e628]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f63e629]:
        - generic "5 из 5" [ref=f63e630]
        - paragraph [ref=f63e641]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f63e642]:
          - generic [ref=f63e643]: Н
          - generic [ref=f63e644]:
            - strong [ref=f63e645]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f63e646]:
        - generic "5 из 5" [ref=f63e647]
        - paragraph [ref=f63e658]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f63e659]:
          - generic [ref=f63e660]: И
          - generic [ref=f63e661]:
            - strong [ref=f63e662]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f63e664] [cursor=pointer]:
