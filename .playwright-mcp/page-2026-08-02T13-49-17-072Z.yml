  - generic [ref=e1267]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=e1268]
    - paragraph [ref=e1269]: Ответы на самые популярные вопросы от родителей
    - generic [ref=e1270]:
      - generic [ref=e1271]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=e1272] [cursor=pointer]
        - paragraph [ref=e1276]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=e1277]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=e1278] [cursor=pointer]
        - paragraph [ref=e1282]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=e1283]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=e1284] [cursor=pointer]
        - paragraph [ref=e1288]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=e1289]:
        - button "Как проходят занятия?" [ref=e1290] [cursor=pointer]
        - paragraph [ref=e1294]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=e1295]:
        - button "Сколько раз в неделю проходят занятия?" [ref=e1296] [cursor=pointer]
        - paragraph [ref=e1300]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=e1301]:
        - button "Как оплачиваются занятия?" [ref=e1302] [cursor=pointer]
        - paragraph [ref=e1306]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=e1307]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=e1308] [cursor=pointer]
        - paragraph [ref=e1312]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=e1313]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=e1314] [cursor=pointer]
        - paragraph [ref=e1318]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=e1319]:
        - button "Как вы обучаете чтению?" [ref=e1320] [cursor=pointer]
        - paragraph [ref=e1324]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
