      - article [ref=e573]:
        - generic "5 из 5" [ref=e574]
        - paragraph [ref=e585]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
