          - generic [ref=e587]: А
          - generic [ref=e588]:
            - strong [ref=e589]: Анна
            - text: мама Софии, 6 лет
      - article [ref=e590]:
        - generic "5 из 5" [ref=e591]
        - paragraph [ref=e602]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=e603]:
          - generic [ref=e604]: Е
          - generic [ref=e605]:
            - strong [ref=e606]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=e607]:
        - generic "5 из 5" [ref=e608]
        - paragraph [ref=e619]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=e620]:
          - generic [ref=e621]: О
          - generic [ref=e622]:
            - strong [ref=e623]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=e624]:
        - generic "5 из 5" [ref=e625]
        - paragraph [ref=e636]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=e637]:
          - generic [ref=e638]: М
          - generic [ref=e639]:
            - strong [ref=e640]: Марина
            - text: мама Вари, 8 лет
      - article [ref=e641]:
        - generic "5 из 5" [ref=e642]
        - paragraph [ref=e653]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=e654]:
          - generic [ref=e655]: Н
          - generic [ref=e656]:
            - strong [ref=e657]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=e658]:
        - generic "5 из 5" [ref=e659]
        - paragraph [ref=e670]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
