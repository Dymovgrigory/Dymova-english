  - generic [ref=f77e550]:
    - generic [ref=f77e551]:
      - generic [ref=f77e552]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f77e554]
      - paragraph [ref=f77e555]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f77e556]:
      - tab "Письменные" [ref=f77e557] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f77e558] [cursor=pointer]
    - generic [ref=f77e560]:
      - article [ref=f77e561]:
        - generic "5 из 5" [ref=f77e562]
        - paragraph [ref=f77e573]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f77e574]:
          - generic [ref=f77e575]: А
          - generic [ref=f77e576]:
            - strong [ref=f77e577]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f77e578]:
        - generic "5 из 5" [ref=f77e579]
        - paragraph [ref=f77e590]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f77e591]:
          - generic [ref=f77e592]: Е
          - generic [ref=f77e593]:
            - strong [ref=f77e594]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f77e595]:
        - generic "5 из 5" [ref=f77e596]
        - paragraph [ref=f77e607]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f77e608]:
          - generic [ref=f77e609]: О
          - generic [ref=f77e610]:
            - strong [ref=f77e611]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f77e612]:
        - generic "5 из 5" [ref=f77e613]
        - paragraph [ref=f77e624]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f77e625]:
          - generic [ref=f77e626]: М
          - generic [ref=f77e627]:
            - strong [ref=f77e628]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f77e629]:
        - generic "5 из 5" [ref=f77e630]
        - paragraph [ref=f77e641]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f77e642]:
          - generic [ref=f77e643]: Н
          - generic [ref=f77e644]:
            - strong [ref=f77e645]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f77e646]:
        - generic "5 из 5" [ref=f77e647]
        - paragraph [ref=f77e658]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f77e659]:
          - generic [ref=f77e660]: И
          - generic [ref=f77e661]:
            - strong [ref=f77e662]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f77e664] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f77e666]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f77e667]
    - paragraph [ref=f77e668]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f77e669]:
      - generic [ref=f77e670]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f77e671] [cursor=pointer]
        - paragraph [ref=f77e675]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f77e676]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f77e677] [cursor=pointer]
        - paragraph [ref=f77e681]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f77e682]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f77e683] [cursor=pointer]
        - paragraph [ref=f77e687]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f77e688]:
        - button "Как проходят занятия?" [ref=f77e689] [cursor=pointer]
        - paragraph [ref=f77e693]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f77e694]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f77e695] [cursor=pointer]
        - paragraph [ref=f77e699]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f77e700]:
        - button "Как оплачиваются занятия?" [ref=f77e701] [cursor=pointer]
        - paragraph [ref=f77e705]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f77e706]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f77e707] [cursor=pointer]
        - paragraph [ref=f77e711]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f77e712]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f77e713] [cursor=pointer]
        - paragraph [ref=f77e717]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f77e718]:
        - button "Как вы обучаете чтению?" [ref=f77e719] [cursor=pointer]
        - paragraph [ref=f77e723]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
