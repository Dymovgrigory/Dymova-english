  - generic [ref=f157e549]:
    - generic [ref=f157e550]:
      - generic [ref=f157e551]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f157e553]
      - paragraph [ref=f157e554]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f157e555]:
      - tab "Письменные" [ref=f157e556] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f157e557] [cursor=pointer]
    - generic [ref=f157e559]:
      - article [ref=f157e560]:
        - generic "5 из 5" [ref=f157e561]
        - paragraph [ref=f157e572]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f157e573]:
          - generic [ref=f157e574]: А
          - generic [ref=f157e575]:
            - strong [ref=f157e576]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f157e577]:
        - generic "5 из 5" [ref=f157e578]
        - paragraph [ref=f157e589]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f157e590]:
          - generic [ref=f157e591]: Е
          - generic [ref=f157e592]:
            - strong [ref=f157e593]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f157e594]:
        - generic "5 из 5" [ref=f157e595]
        - paragraph [ref=f157e606]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f157e607]:
          - generic [ref=f157e608]: О
          - generic [ref=f157e609]:
            - strong [ref=f157e610]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f157e611]:
        - generic "5 из 5" [ref=f157e612]
        - paragraph [ref=f157e623]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f157e624]:
          - generic [ref=f157e625]: М
          - generic [ref=f157e626]:
            - strong [ref=f157e627]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f157e628]:
        - generic "5 из 5" [ref=f157e629]
        - paragraph [ref=f157e640]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f157e641]:
          - generic [ref=f157e642]: Н
          - generic [ref=f157e643]:
            - strong [ref=f157e644]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f157e645]:
        - generic "5 из 5" [ref=f157e646]
        - paragraph [ref=f157e657]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f157e658]:
          - generic [ref=f157e659]: И
          - generic [ref=f157e660]:
            - strong [ref=f157e661]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f157e663] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f157e665]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f157e666]
    - paragraph [ref=f157e667]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f157e668]:
      - generic [ref=f157e669]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f157e670] [cursor=pointer]
        - paragraph [ref=f157e674]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f157e675]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f157e676] [cursor=pointer]
        - paragraph [ref=f157e680]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f157e681]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f157e682] [cursor=pointer]
        - paragraph [ref=f157e686]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f157e687]:
        - button "Как проходят занятия?" [ref=f157e688] [cursor=pointer]
        - paragraph [ref=f157e692]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f157e693]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f157e694] [cursor=pointer]
        - paragraph [ref=f157e698]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f157e699]:
        - button "Как оплачиваются занятия?" [ref=f157e700] [cursor=pointer]
        - paragraph [ref=f157e704]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f157e705]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f157e706] [cursor=pointer]
        - paragraph [ref=f157e710]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f157e711]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f157e712] [cursor=pointer]
        - paragraph [ref=f157e716]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f157e717]:
        - button "Как вы обучаете чтению?" [ref=f157e718] [cursor=pointer]
        - paragraph [ref=f157e722]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
