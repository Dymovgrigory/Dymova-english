  - generic [ref=f76e568]:
    - generic [ref=f76e569]:
      - generic [ref=f76e570]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f76e572]
      - paragraph [ref=f76e573]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f76e574]:
      - tab "Письменные" [ref=f76e575] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f76e576] [cursor=pointer]
    - generic [ref=f76e578]:
      - article [ref=f76e579]:
        - generic "5 из 5" [ref=f76e580]
        - paragraph [ref=f76e591]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f76e592]:
          - generic [ref=f76e593]: А
          - generic [ref=f76e594]:
            - strong [ref=f76e595]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f76e596]:
        - generic "5 из 5" [ref=f76e597]
        - paragraph [ref=f76e608]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f76e609]:
          - generic [ref=f76e610]: Е
          - generic [ref=f76e611]:
            - strong [ref=f76e612]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f76e613]:
        - generic "5 из 5" [ref=f76e614]
        - paragraph [ref=f76e625]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f76e626]:
          - generic [ref=f76e627]: О
          - generic [ref=f76e628]:
            - strong [ref=f76e629]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f76e630]:
        - generic "5 из 5" [ref=f76e631]
        - paragraph [ref=f76e642]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f76e643]:
          - generic [ref=f76e644]: М
          - generic [ref=f76e645]:
            - strong [ref=f76e646]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f76e647]:
        - generic "5 из 5" [ref=f76e648]
        - paragraph [ref=f76e659]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f76e660]:
          - generic [ref=f76e661]: Н
          - generic [ref=f76e662]:
            - strong [ref=f76e663]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f76e664]:
        - generic "5 из 5" [ref=f76e665]
        - paragraph [ref=f76e676]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f76e677]:
          - generic [ref=f76e678]: И
          - generic [ref=f76e679]:
            - strong [ref=f76e680]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f76e682] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f76e684]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f76e685]
    - paragraph [ref=f76e686]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f76e687]:
      - generic [ref=f76e688]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f76e689] [cursor=pointer]
        - paragraph [ref=f76e693]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f76e694]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f76e695] [cursor=pointer]
        - paragraph [ref=f76e699]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f76e700]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f76e701] [cursor=pointer]
        - paragraph [ref=f76e705]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f76e706]:
        - button "Как проходят занятия?" [ref=f76e707] [cursor=pointer]
        - paragraph [ref=f76e711]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f76e712]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f76e713] [cursor=pointer]
        - paragraph [ref=f76e717]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f76e718]:
        - button "Как оплачиваются занятия?" [ref=f76e719] [cursor=pointer]
        - paragraph [ref=f76e723]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f76e724]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f76e725] [cursor=pointer]
        - paragraph [ref=f76e729]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f76e730]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f76e731] [cursor=pointer]
        - paragraph [ref=f76e735]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f76e736]:
        - button "Как вы обучаете чтению?" [ref=f76e737] [cursor=pointer]
        - paragraph [ref=f76e741]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
