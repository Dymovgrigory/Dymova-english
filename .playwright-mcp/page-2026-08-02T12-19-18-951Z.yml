  - generic [ref=f12e562]:
    - generic [ref=f12e563]:
      - generic [ref=f12e564]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f12e566]
      - paragraph [ref=f12e567]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f12e568]:
      - tab "Письменные" [ref=f12e569] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f12e570] [cursor=pointer]
    - generic [ref=f12e572]:
      - article [ref=f12e573]:
        - generic "5 из 5" [ref=f12e574]
        - paragraph [ref=f12e585]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f12e586]:
          - generic [ref=f12e587]: А
          - generic [ref=f12e588]:
            - strong [ref=f12e589]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f12e590]:
        - generic "5 из 5" [ref=f12e591]
        - paragraph [ref=f12e602]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f12e603]:
          - generic [ref=f12e604]: Е
          - generic [ref=f12e605]:
            - strong [ref=f12e606]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f12e607]:
        - generic "5 из 5" [ref=f12e608]
        - paragraph [ref=f12e619]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f12e620]:
          - generic [ref=f12e621]: О
          - generic [ref=f12e622]:
            - strong [ref=f12e623]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f12e624]:
        - generic "5 из 5" [ref=f12e625]
        - paragraph [ref=f12e636]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f12e637]:
          - generic [ref=f12e638]: М
          - generic [ref=f12e639]:
            - strong [ref=f12e640]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f12e641]:
        - generic "5 из 5" [ref=f12e642]
        - paragraph [ref=f12e653]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f12e654]:
          - generic [ref=f12e655]: Н
          - generic [ref=f12e656]:
            - strong [ref=f12e657]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f12e658]:
        - generic "5 из 5" [ref=f12e659]
        - paragraph [ref=f12e670]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f12e671]:
          - generic [ref=f12e672]: И
          - generic [ref=f12e673]:
            - strong [ref=f12e674]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f12e676] [cursor=pointer]:
      - /url: "#fxb-enrollment"
