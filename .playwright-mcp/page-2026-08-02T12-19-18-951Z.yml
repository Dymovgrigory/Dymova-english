              - generic [ref=f12e1012]: Яндекс Карты
            - paragraph [ref=f12e1013]: Ребёнку 2,5 года. Ходим на занятия «Мама+малыш». Очень понравилось что во время пребывания в клубе ребёнок полностью погружается в иностранную речь и начиная с приветствия и до прощания все обращения только на английском языке. Отдельно хочу отметить уровень владения языком, а самое главное - произношение, у всех преподавателей на высоком уровне. Жалею только что не узнали об этом месте раньше. Дочка уже после первого занятия…
            - generic [ref=f12e1014]:
              - generic [ref=f12e1015]: "Y"
              - generic [ref=f12e1016]:
                - strong [ref=f12e1017]: Yulia K.
                - text: 2 августа 2022 · филиал Ракетостроителей, 9к3
          - article [ref=f12e1018]:
            - generic [ref=f12e1019]:
              - generic "Оценка 5 из 5" [ref=f12e1020]
              - generic [ref=f12e1031]: Яндекс Карты
            - paragraph [ref=f12e1032]: Дочь второй год посещает Фокси Фокс, с радостью ходит на занятия. В выходные посещает английский клуб, где происходит общение с носителем языка. Очень нравится, что домашние задания есть не только в тетради, но и в приложении. Также в приложении можно отследить успехи и посещение ребенка,что в нашей жизни очень актуально. Вообще мне нравится семейная и дружелюбная обстановка в этой школе, с удовольствием рекомендую ее всем…
            - generic [ref=f12e1033]:
              - generic [ref=f12e1034]: Н
              - generic [ref=f12e1035]:
                - strong [ref=f12e1036]: Надежда Надежда
                - text: 20 октября 2025 · филиал Ракетостроителей, 9к3
          - article [ref=f12e1037]:
            - generic [ref=f12e1038]:
              - generic "Оценка 5 из 5" [ref=f12e1039]
              - generic [ref=f12e1050]: Яндекс Карты
            - paragraph [ref=f12e1051]: Английский клуб FoxyFox. Мой младший сын и старший ходят сюда второй год. Есть возможность офлайн и онлайн обучения. Ребенок идет на занятия с удовольствием, очень любит свою учительницу Елизавету. Летом на каникулах занимались онлайн прямо на даче. Уроки очень интересные, дети на уроках рисуют, поют, обучение проходит в игровой форме. Обучающие материалы-красочные, легко воспринимаются, не скучные. Рекомендую! 🌸
            - generic [ref=f12e1052]:
              - generic [ref=f12e1053]: "N"
              - generic [ref=f12e1054]:
                - strong [ref=f12e1055]: Nadin
                - text: 11 апреля 2025 · филиал Ракетостроителей, 9к3
          - article [ref=f12e1056]:
            - generic [ref=f12e1057]:
              - generic "Оценка 5 из 5" [ref=f12e1058]
              - generic [ref=f12e1069]: Яндекс Карты
            - paragraph [ref=f12e1070]: Дети ходят в ФоксиФокс(возле 11 школы). За первый месяц реально отпали проблемы с домашкой по английскому в школе. Учитель всегда просит, если есть вопросы по школьному материалу, обращаться, не стесняться. Каждый раз дает обратную связь. Приложение, с покупкой призов за баллы тоже очень мотивирующая вещь. В общем молодцы, так держать. Уже записала детвору на будущий год. Знакомым советую, с чистой совестью.
            - generic [ref=f12e1071]:
              - generic [ref=f12e1072]: Н
              - generic [ref=f12e1073]:
                - strong [ref=f12e1074]: Наталия К.
                - text: 3 июня · филиал Лихачёвский, 76к1
          - article [ref=f12e1075]:
            - generic [ref=f12e1076]:
              - generic "Оценка 5 из 5" [ref=f12e1077]
              - generic [ref=f12e1088]: Яндекс Карты
            - paragraph [ref=f12e1089]: Дочке нравится ходить на занятия в Foxy. Очень радуют поощрения в виде монеток, на которые можно потом что-нибудь купить. В классе немного учеников, что позволяет учителю уделять внимание каждому учащемуся. Для нас это было важно при выборе дополнительных занятий. Со слов дочки, атмосфера в классе дружелюбная, легкая и комфортная. Спасибо за позитивное отношение к детям! 🦊
            - generic [ref=f12e1090]:
              - generic [ref=f12e1091]: Э
              - generic [ref=f12e1092]:
                - strong [ref=f12e1093]: Эльмира Х.
                - text: 23 декабря 2024 · филиал Ракетостроителей, 9к3
          - article [ref=f12e1094]:
            - generic [ref=f12e1095]:
              - generic "Оценка 5 из 5" [ref=f12e1096]
              - generic [ref=f12e1107]: Яндекс Карты
            - paragraph [ref=f12e1108]: Прекрасные преподаватели с отличной методикой развития языка. Давно занимаемся в этой школе и прогресс очень хорошо заметен. Занимались как очно, так и онлайн - в любом формате преподаватели умеют увлечь и заинтересовать детей. Ну и много активностей и мероприятий. У нашей дочки любимый - это хэллоуин, ходим постоянно :)
