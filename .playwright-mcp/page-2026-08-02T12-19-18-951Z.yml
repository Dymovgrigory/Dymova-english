            - paragraph [ref=f12e897]: Дети бегут сюда с большим удовольствием! Старший ребенок ходит 4й год и занятия очень помогают восполнять пробелы школьного уровня. В этом году в Фокси пришел и младший. Уроки интересные, насыщенные, много дополнительных дидактических материалов, преподаватели славные, умеют увлечь, особенно хочется отметить Алину! Администраторы всегда неравнодушны и внимательны даже к мелочам! Руководитель Вероника вообще большая умничка…
            - generic [ref=f12e898]:
