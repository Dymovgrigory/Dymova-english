            - paragraph [ref=f12e725]: Ходили в эту школу,когда она была еще по другому адресу,и ходим сейчас. Хочу сказать только положительные отзывы. Дочь ходила 2 года до школы и потом не ходила ни сюда, ни к репетитору,так вот 1 и 2 класс в школе английский идеально прошёл на базе полученых тут знаний и словарного запаса, без помощи со стороны. Сейчас ходит сын,тоже дошкольник и просто влюблён в английский. Шикарной мотивацией служит приложение на телефоне от…
