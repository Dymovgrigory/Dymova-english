            - paragraph [ref=f12e782]: Моя дочь , 8 лет , 2 класс, ходит на занятия уже полгода. Ходит с удовольствием, очень нравится учитель Алина Зинуровна. Занятия помогают усваивать школьный материал. Триместр закончили на 5. Уроки проходят в легкой , игровой форме. Во время игры учат слова и уже не нужно зубрить их дома. Был опыт хождения на курсы в Welcome. Небо и Земля. Там урок проходил как в школе, учитель давал новый материал, потом в основном…
