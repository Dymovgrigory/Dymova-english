            - paragraph [ref=f12e801]: Отличное место, прекрасная команда! Обоим моим детям очень нравится тут учиться. Очень хорошие педагоги, которые находят контакт с ребенком, маленькие группы, у нас 6 человек, игровая форма обучения, геймификация, мобильное приложение, внутренняя валюта и магазин, где можно обменять заработанные баллы на подарки. Моим детям очень зашло и все нравится, ходят с удовольствием, домашку делают без принуждения. К тому же…
