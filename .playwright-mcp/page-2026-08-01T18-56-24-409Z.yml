        - generic [ref=f91e51]: "Запись на новый учебный год: английский, немецкий, китайский"
      - generic [ref=f91e52]:
        - heading "Три языка, один принцип" [level=2] [ref=f91e53]
        - paragraph [ref=f91e54]: "К новому учебному году в Фоксинбурге можно записаться на английский, немецкий или китайский — и по всем трём мы ведём занятия по одной и той же методике: понятная система языка, живое общение с первых занятий и мини-группы, где педагог успевает уделить время каждому. Разница между языками — в содержании, а не в подходе: во сколько бы вы ни начинали, ребёнку или взрослому не приходится заново учиться быть учеником при смене языка."
        - heading "Какие форматы есть" [level=2] [ref=f91e55]
        - list [ref=f91e56]:
          - listitem [ref=f91e57]: Очно в двух филиалах в Долгопрудном — на Лихачевского, 76к1 и на Ракетостроителей, 9к3.
          - listitem [ref=f91e58]: Онлайн с педагогом — живые уроки для тех, кому удобнее заниматься из дома.
          - listitem [ref=f91e59]: Мини-группы, подобранные по возрасту и уровню — для дошкольников, школьников, подростков и взрослых отдельно.
          - listitem [ref=f91e60]: Индивидуальные занятия — персональный темп и график, если групповой формат не подходит по времени или задачам.
        - paragraph [ref=f91e61]: "Формат не обязательно выбирать раз и навсегда: часто удобно начать с мини-группы, а индивидуальные занятия подключить точечно — например, перед конкретным экзаменом или поездкой."
        - heading "С чего начинается запись" [level=2] [ref=f91e62]
        - paragraph [ref=f91e63]: "Для детей на английском — школа начинается с бесплатной диагностики: определяем реальный уровень и подбираем группу по возрасту, без формального теста и стресса. Для немецкого и китайского первый шаг — пробный урок: знакомим с педагогом и методикой, оцениваем уровень (или подтверждаем, что стартуем с нуля — большинство и начинает с нуля) и подбираем группу. Взрослым на английском мы тоже предлагаем начать с бесплатной диагностики — она нужна именно для честной картины «где вы сейчас», а не для оценки."
        - paragraph [ref=f91e64]: "Дальше — обычная последовательность: заявка на сайте или в MAX, диагностика или пробный урок, подбор группы или индивидуального расписания, и старт занятий. Если сомневаетесь между языками или форматами — на диагностике можно обсудить это вслух, а не гадать заранее."
        - heading "Как оплатить обучение" [level=2] [ref=f91e65]
        - paragraph [ref=f91e66]: На немецком, китайском и на английском для взрослых занятия можно оплатить материнским капиталом и вернуть 13% стоимости социальным налоговым вычетом — это не отдельная акция, а постоянно доступный вариант оплаты, о нём можно уточнить на диагностике или пробном уроке.
        - heading "Если ещё не решили, с какого языка начать" [level=2] [ref=f91e67]
        - paragraph [ref=f91e68]:
          - text: Если ребёнок уже учит английский и вы думаете о втором языке — мы недавно разбирали,
          - link "как выбрать между немецким и китайским" [ref=f91e69] [cursor=pointer]:
            - /url: /novosti-vtoroj-inostrannyj-yazyk-nemeckij-ili-kitajskij
          - text: . А если хочется для начала понять, в какой форме ребёнок подошёл к концу лета, — в статье про то,
          - link "как английский переживает летние каникулы" [ref=f91e70] [cursor=pointer]:
            - /url: /novosti-anglijskij-letom-kak-ne-poteryat-navyk
          - text: ", есть простой ориентир, стоит ли переживать."
