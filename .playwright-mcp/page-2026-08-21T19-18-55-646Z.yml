    - generic [ref=f4e75]:
      - navigation [ref=f4e76]:
        - link "Главная" [ref=f4e77] [cursor=pointer]:
          - /url: /
        - generic [ref=f4e78]: →
        - link "Блог" [ref=f4e79] [cursor=pointer]:
          - /url: /blog
        - generic [ref=f4e80]: →
        - generic [ref=f4e81]: "Хэллоуин и Рождество в Фоксинбурге: как праздники учат английскому"
      - generic [ref=f4e82]:
        - heading "Праздник как педагогический инструмент" [level=2] [ref=f4e83]
        - paragraph [ref=f4e84]: "В хорошей языковой школе праздники — не «развлечение вместо занятий», а одна из самых мощных форм обучения. На Хэллоуине ребёнок забывает, что «занимается английским»: он гадает загадки, участвует в квесте, кричит «trick or treat!» — и всё это на языке, который в обычном классе достаётся с усилием. Психологи называют это снижением аффективного фильтра: в состоянии игры и азарта языковой барьер падает, и дети говорят в разы больше, чем на уроке. Вторая функция праздников — культурная: язык существует не в вакууме, и ребёнок, знающий, что такое Рождество в англоязычных странах, понимает тексты и фильмы глубже. Третья — социальная: общие события склеивают группу, а от того, нравится ли ребёнку ходить в школу, зависит половина результата."
        - 'heading "Хэллоуин: главный «языковой» праздник осени" [level=2] [ref=f4e85]'
        - paragraph [ref=f4e86]: "Хэллоуин в Фоксинбурге — традиционно самое громкое событие осени. Формат — костюмированный квест на английском: станции с заданиями (загадки, «spell the word», характерные игры вроде «mummy wrap»), костюм-парад с представлением персонажа на английском и традиционный обход «trick or treat». Словарь праздника дети впитывают без усилий: pumpkin, witch, ghost, spooky, costume — эти слова потом годами всплывают в их речи, потому что привязаны к эмоции. Готовимся заранее: за две недели на занятиях разучиваем песни и чант-скороговорки праздника, обсуждаем костюмы. Родителям совет: не шейте костюм «в секрете» — пусть ребёнок сам представит персонажа по-английски, это часть задания."
        - 'heading "Рождество и Новый год: тёплый английский декабря" [level=2] [ref=f4e87]'
        - paragraph [ref=f4e88]: "Декабрьская программа строится вокруг рождественских традиций англоязычных стран: дети узнают, почему англичане вешают носки у камина, кто такой Santa и при чём тут олень Rudolph, что поют carols. Практический слой — письма Санте на английском (лучшее письменное задание года: мотивация встроенная), рождественские песни и праздничное чаепитие, где каждая группа готовит короткое выступление: сценку, песню или стихотворение. Для младших это первый опыт публичного выступления на языке — бесценный для уверенности. Родители на финальное выступление приглашаются: увидеть ребёнка, поющего «Jingle Bells» в обнимку с группой, — лучший ответ на вопрос «а есть ли толк от занятий»."
        - 'heading "Чем праздник отличается от урока: честное сравнение" [level=2] [ref=f4e89]'
        - list [ref=f4e90]:
          - listitem [ref=f4e91]: "Объём речи: на квесте ребёнок говорит по-английски 30–40 минут подряд в живом общении — столько не даёт ни один урок."
          - listitem [ref=f4e92]: "Эмоциональная память: слова и фразы, выученные в игре с азартом, запоминаются в разы прочнее классных."
          - listitem [ref=f4e93]: "Культура: праздник даёт культурный контекст, без которого тексты и фильмы понимаются «поверхностно»."
          - listitem [ref=f4e94]: "Мотивация: события, которые ждут, удерживают интерес к языку длинными зимними месяцами лучше любых похвал."
          - listitem [ref=f4e95]:
            - text: "Что праздник НЕ заменяет: системную грамматику и регулярную практику — это витамин, а не основная еда. Основа — занятия в группах"
            - link "дошкольников" [ref=f4e96] [cursor=pointer]:
              - /url: /doshkolniki
            - text: ","
            - link "младших школьников" [ref=f4e97] [cursor=pointer]:
              - /url: /mladshie-shkolniki
            - text: и
            - link "подростков" [ref=f4e98] [cursor=pointer]:
              - /url: /podrostki
            - text: .
        - heading "Как попасть и что нужно знать родителю" [level=2] [ref=f4e99]
        - paragraph [ref=f4e100]:
          - text: "Праздники открыты для учеников школы, а часть событий — и для гостей по записи: это хороший способ познакомиться со школой вживую, если вы только присматриваетесь. Анонсы публикуются в разделе"
          - link "новостей" [ref=f4e101] [cursor=pointer]:
            - /url: /novosti
          - text: за две-три недели до события — там же указаны возраст, дресс-код и нужна ли подготовка. Участие обычно входит в абонемент или оплачивается символически отдельно — детали уточняйте у администраторов через
          - link "контакты" [ref=f4e102] [cursor=pointer]:
            - /url: /kontakty
          - text: "или в мессенджере. От родителя требуется немного: помочь с костюмом, привести вовремя и не подсказывать из зала — пусть ребёнок сам справляется со станциями. Если ребёнок стеснительный, предупредите педагога: мы всегда даём таким детям роли «при поддержке» — в паре или с ведущим, а не соло."
        - heading "Календарь учебного года" [level=2] [ref=f4e103]
        - paragraph [ref=f4e104]:
          - text: Помимо Хэллоуина и Рождества, в годовом цикле Фоксинбурга есть осенний старт с праздником знакомства, зимние читательские марафоны, весенний speaking club-фестиваль и летние смены
          - link "Летней академии" [ref=f4e105] [cursor=pointer]:
            - /url: /letnyaya-akademiya
          - text: с тематическими днями. Всё это складывается в среду, где английский — не предмет два раза в неделю, а часть жизни ребёнка. Именно поэтому наши ученики не спрашивают «зачем мне английский» — у них есть ответ из собственного опыта. Следите за анонсами в
          - link "новостях" [ref=f4e106] [cursor=pointer]:
            - /url: /novosti
          - text: "и приходите: ближайшее событие уже в календаре."
