    - generic [ref=f4e67]:
      - generic [ref=f4e68]: Школа и учёба
      - 'heading "Хэллоуин и Рождество в Фоксинбурге: как праздники учат английскому" [level=1] [ref=f4e70]'
      - generic [ref=f4e71]:
        - generic [ref=f4e72]: 18 августа 2026
