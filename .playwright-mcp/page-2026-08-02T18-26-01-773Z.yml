                - paragraph [ref=f3e825]:
                  - strong [ref=f3e826]: Ситуация 2. Опоздание начала урока
                - paragraph [ref=f3e827]: Вы понимаете, что урок начался на 5 минут позже, потому что вы искали аудио и распечатывали материал.
                - paragraph [ref=f3e828]: "Вопрос:"
                - paragraph [ref=f3e829]: Что в этой ситуации было организовано неправильно? Как вы предотвратите это в будущем?
                - paragraph [ref=f3e830]:
