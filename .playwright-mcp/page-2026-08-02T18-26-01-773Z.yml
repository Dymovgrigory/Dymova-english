                - paragraph [ref=f3e833]: "Вопрос:"
                - paragraph [ref=f3e834]: Почему это не соответствует регламенту? Как вы организуете доску правильно?
                - paragraph [ref=f3e835]:
                  - strong [ref=f3e836]: Задание 3.
                - paragraph [ref=f3e837]:
                  - strong [ref=f3e838]: Напишите развернутые ответы на вопросы
                - paragraph [ref=f3e839]: 1. Что вы сделаете до и после урока?
                - paragraph [ref=f3e840]: "До урока: Напишите, что подготовите заранее."
                - paragraph [ref=f3e841]: "После урока: Напишите, что сделаете после окончания занятия."
                - paragraph [ref=f3e842]: 2. Что вы сделаете, если понимаете, что не успеваете пройти весь материал по КТП на уроке?
              - generic [ref=f3e843]:
                - generic [ref=f3e844]:
                  - paragraph [ref=f3e845]: Задание
                  - heading "Домашнее задание организация урока" [level=3] [ref=f3e846]
                  - paragraph [ref=f3e847]: "<p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\"><strong>Задание 2. </strong></p><br /><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\"><strong>Прочитайте ситуацию и опишите, как вы будете действовать.</strong></p><br /><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\"><strong>Ситуация 1. Ученик без учебника</strong></p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">На урок пришли 6 детей. Один ребенок забыл учебник. До начала урока осталось 3 минуты. Остальные дети уже сидят и ждут.</p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">Вопрос:</p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">Что вы будете делать?</p><br /><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\"><strong>Ситуация 2. Опоздание начала урока</strong></p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">Вы понимаете, что урок начался на 5 минут позже, потому что вы искали аудио и распечатывали материал.</p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">Вопрос:</p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">Что в этой ситуации было организовано неправильно? Как вы предотвратите это в будущем?</p><br /><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\"><strong>Ситуация 3. Работа с доской</strong></p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">Во время объяснения вы быстро записываете слова на доске курсивом, часть слов трудно прочитать, примеры разбросаны по разным углам доски.</p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">Вопрос:</p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">Почему это не соответствует регламенту? Как вы организуете доску правильно?</p><br /><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\"><strong>Задание 3.</strong></p><br /><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\"><strong>Напишите развернутые ответы на вопросы</strong></p><br /><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">1. Что вы сделаете до и после урока?</p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">До урока: Напишите, что подготовите заранее.</p><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">После урока: Напишите, что сделаете после окончания занятия.</p><br /><p style=\"line-height:114.99999999999999%;margin-bottom:0pt;margin-top:0pt\">2. Что вы сделаете, если понимаете, что не успеваете пройти весь материал по КТП на уроке?</p>"
