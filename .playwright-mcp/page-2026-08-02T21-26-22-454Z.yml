              - generic [ref=f20e899]: Яндекс Карты
            - paragraph [ref=f20e900]: Английский клуб FoxyFox. Мой младший сын и старший ходят сюда второй год. Есть возможность офлайн и онлайн обучения. Ребенок идет на занятия с удовольствием, очень любит свою учительницу Елизавету. Летом на каникулах занимались онлайн прямо на даче. Уроки очень интересные, дети на уроках рисуют, поют, обучение проходит в игровой форме. Обучающие материалы-красочные, легко воспринимаются, не скучные. Рекомендую! 🌸
            - generic [ref=f20e901]:
