            - paragraph [ref=f20e919]: Дети ходят в ФоксиФокс(возле 11 школы). За первый месяц реально отпали проблемы с домашкой по английскому в школе. Учитель всегда просит, если есть вопросы по школьному материалу, обращаться, не стесняться. Каждый раз дает обратную связь. Приложение, с покупкой призов за баллы тоже очень мотивирующая вещь. В общем молодцы, так держать. Уже записала детвору на будущий год. Знакомым советую, с чистой совестью.
            - generic [ref=f20e920]:
              - generic [ref=f20e921]: Н
              - generic [ref=f20e922]:
                - strong [ref=f20e923]: Наталия К.
                - text: 3 июня · филиал Лихачёвский, 76к1
          - article [ref=f20e924]:
