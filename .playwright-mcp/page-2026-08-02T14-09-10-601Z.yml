            - paragraph [ref=f24e992]: Прекрасные преподаватели с отличной методикой развития языка. Давно занимаемся в этой школе и прогресс очень хорошо заметен. Занимались как очно, так и онлайн - в любом формате преподаватели умеют увлечь и заинтересовать детей. Ну и много активностей и мероприятий. У нашей дочки любимый - это хэллоуин, ходим постоянно :)
