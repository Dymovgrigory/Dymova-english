              - generic [ref=f24e919]:
                - strong [ref=f24e920]: Надежда Надежда
                - text: 20 октября 2025 · филиал Ракетостроителей, 9к3
          - article [ref=f24e921]:
            - generic [ref=f24e922]:
              - generic "Оценка 5 из 5" [ref=f24e923]
              - generic [ref=f24e934]: Яндекс Карты
            - paragraph [ref=f24e935]: Английский клуб FoxyFox. Мой младший сын и старший ходят сюда второй год. Есть возможность офлайн и онлайн обучения. Ребенок идет на занятия с удовольствием, очень любит свою учительницу Елизавету. Летом на каникулах занимались онлайн прямо на даче. Уроки очень интересные, дети на уроках рисуют, поют, обучение проходит в игровой форме. Обучающие материалы-красочные, легко воспринимаются, не скучные. Рекомендую! 🌸
            - generic [ref=f24e936]:
              - generic [ref=f24e937]: "N"
              - generic [ref=f24e938]:
                - strong [ref=f24e939]: Nadin
                - text: 11 апреля 2025 · филиал Ракетостроителей, 9к3
          - article [ref=f24e940]:
            - generic [ref=f24e941]:
              - generic "Оценка 5 из 5" [ref=f24e942]
              - generic [ref=f24e953]: Яндекс Карты
            - paragraph [ref=f24e954]: Дети ходят в ФоксиФокс(возле 11 школы). За первый месяц реально отпали проблемы с домашкой по английскому в школе. Учитель всегда просит, если есть вопросы по школьному материалу, обращаться, не стесняться. Каждый раз дает обратную связь. Приложение, с покупкой призов за баллы тоже очень мотивирующая вещь. В общем молодцы, так держать. Уже записала детвору на будущий год. Знакомым советую, с чистой совестью.
            - generic [ref=f24e955]:
              - generic [ref=f24e956]: Н
              - generic [ref=f24e957]:
                - strong [ref=f24e958]: Наталия К.
                - text: 3 июня · филиал Лихачёвский, 76к1
          - article [ref=f24e959]:
            - generic [ref=f24e960]:
              - generic "Оценка 5 из 5" [ref=f24e961]
              - generic [ref=f24e972]: Яндекс Карты
            - paragraph [ref=f24e973]: Дочке нравится ходить на занятия в Foxy. Очень радуют поощрения в виде монеток, на которые можно потом что-нибудь купить. В классе немного учеников, что позволяет учителю уделять внимание каждому учащемуся. Для нас это было важно при выборе дополнительных занятий. Со слов дочки, атмосфера в классе дружелюбная, легкая и комфортная. Спасибо за позитивное отношение к детям! 🦊
