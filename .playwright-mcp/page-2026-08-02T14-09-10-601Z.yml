          - article [ref=f24e902]:
            - generic [ref=f24e903]:
              - generic "Оценка 5 из 5" [ref=f24e904]
              - generic [ref=f24e915]: Яндекс Карты
            - paragraph [ref=f24e916]: Дочь второй год посещает Фокси Фокс, с радостью ходит на занятия. В выходные посещает английский клуб, где происходит общение с носителем языка. Очень нравится, что домашние задания есть не только в тетради, но и в приложении. Также в приложении можно отследить успехи и посещение ребенка,что в нашей жизни очень актуально. Вообще мне нравится семейная и дружелюбная обстановка в этой школе, с удовольствием рекомендую ее всем…
