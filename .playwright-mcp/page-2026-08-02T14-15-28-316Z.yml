  - generic [ref=f36e1151]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f36e1152]
    - paragraph [ref=f36e1153]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f36e1154]:
      - generic [ref=f36e1155]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f36e1156] [cursor=pointer]
        - paragraph [ref=f36e1160]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f36e1161]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f36e1162] [cursor=pointer]
        - paragraph [ref=f36e1166]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f36e1167]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f36e1168] [cursor=pointer]
        - paragraph [ref=f36e1172]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f36e1173]:
        - button "Как проходят занятия?" [ref=f36e1174] [cursor=pointer]
        - paragraph [ref=f36e1178]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f36e1179]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f36e1180] [cursor=pointer]
        - paragraph [ref=f36e1184]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f36e1185]:
        - button "Как оплачиваются занятия?" [ref=f36e1186] [cursor=pointer]
        - paragraph [ref=f36e1190]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f36e1191]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f36e1192] [cursor=pointer]
        - paragraph [ref=f36e1196]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f36e1197]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f36e1198] [cursor=pointer]
        - paragraph [ref=f36e1202]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f36e1203]:
        - button "Как вы обучаете чтению?" [ref=f36e1204] [cursor=pointer]
        - paragraph [ref=f36e1208]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
