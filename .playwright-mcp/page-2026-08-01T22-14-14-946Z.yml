  - generic [ref=f169e549]:
    - generic [ref=f169e550]:
      - generic [ref=f169e551]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f169e553]
      - paragraph [ref=f169e554]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f169e555]:
      - tab "Письменные" [ref=f169e556] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f169e557] [cursor=pointer]
    - generic [ref=f169e559]:
      - article [ref=f169e560]:
        - generic "5 из 5" [ref=f169e561]
        - paragraph [ref=f169e572]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f169e573]:
          - generic [ref=f169e574]: А
          - generic [ref=f169e575]:
            - strong [ref=f169e576]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f169e577]:
        - generic "5 из 5" [ref=f169e578]
        - paragraph [ref=f169e589]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f169e590]:
          - generic [ref=f169e591]: Е
          - generic [ref=f169e592]:
            - strong [ref=f169e593]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f169e594]:
        - generic "5 из 5" [ref=f169e595]
        - paragraph [ref=f169e606]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f169e607]:
          - generic [ref=f169e608]: О
          - generic [ref=f169e609]:
            - strong [ref=f169e610]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f169e611]:
        - generic "5 из 5" [ref=f169e612]
        - paragraph [ref=f169e623]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f169e624]:
          - generic [ref=f169e625]: М
          - generic [ref=f169e626]:
            - strong [ref=f169e627]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f169e628]:
        - generic "5 из 5" [ref=f169e629]
        - paragraph [ref=f169e640]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f169e641]:
          - generic [ref=f169e642]: Н
          - generic [ref=f169e643]:
            - strong [ref=f169e644]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f169e645]:
        - generic "5 из 5" [ref=f169e646]
        - paragraph [ref=f169e657]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f169e658]:
          - generic [ref=f169e659]: И
          - generic [ref=f169e660]:
            - strong [ref=f169e661]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f169e663] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f169e665]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f169e666]
    - paragraph [ref=f169e667]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f169e668]:
      - generic [ref=f169e669]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f169e670] [cursor=pointer]
        - paragraph [ref=f169e674]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f169e675]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f169e676] [cursor=pointer]
        - paragraph [ref=f169e680]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f169e681]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f169e682] [cursor=pointer]
        - paragraph [ref=f169e686]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f169e687]:
        - button "Как проходят занятия?" [ref=f169e688] [cursor=pointer]
        - paragraph [ref=f169e692]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f169e693]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f169e694] [cursor=pointer]
        - paragraph [ref=f169e698]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f169e699]:
        - button "Как оплачиваются занятия?" [ref=f169e700] [cursor=pointer]
        - paragraph [ref=f169e704]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f169e705]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f169e706] [cursor=pointer]
        - paragraph [ref=f169e710]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f169e711]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f169e712] [cursor=pointer]
        - paragraph [ref=f169e716]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f169e717]:
        - button "Как вы обучаете чтению?" [ref=f169e718] [cursor=pointer]
        - paragraph [ref=f169e722]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
