  - generic [ref=f12e1145]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f12e1146]
    - paragraph [ref=f12e1147]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f12e1148]:
      - generic [ref=f12e1149]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f12e1150] [cursor=pointer]
        - paragraph [ref=f12e1154]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f12e1155]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f12e1156] [cursor=pointer]
        - paragraph [ref=f12e1160]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f12e1161]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f12e1162] [cursor=pointer]
        - paragraph [ref=f12e1166]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f12e1167]:
        - button "Как проходят занятия?" [ref=f12e1168] [cursor=pointer]
        - paragraph [ref=f12e1172]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f12e1173]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f12e1174] [cursor=pointer]
        - paragraph [ref=f12e1178]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f12e1179]:
        - button "Как оплачиваются занятия?" [ref=f12e1180] [cursor=pointer]
        - paragraph [ref=f12e1184]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f12e1185]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f12e1186] [cursor=pointer]
        - paragraph [ref=f12e1190]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f12e1191]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f12e1192] [cursor=pointer]
        - paragraph [ref=f12e1196]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f12e1197]:
        - button "Как вы обучаете чтению?" [ref=f12e1198] [cursor=pointer]
        - paragraph [ref=f12e1202]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
