  - generic [ref=f44e1132]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f44e1133]
    - paragraph [ref=f44e1134]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f44e1135]:
      - generic [ref=f44e1136]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f44e1137] [cursor=pointer]
        - paragraph [ref=f44e1141]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f44e1142]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f44e1143] [cursor=pointer]
        - paragraph [ref=f44e1147]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f44e1148]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f44e1149] [cursor=pointer]
        - paragraph [ref=f44e1153]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f44e1154]:
        - button "Как проходят занятия?" [ref=f44e1155] [cursor=pointer]
        - paragraph [ref=f44e1159]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f44e1160]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f44e1161] [cursor=pointer]
        - paragraph [ref=f44e1165]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f44e1166]:
        - button "Как оплачиваются занятия?" [ref=f44e1167] [cursor=pointer]
        - paragraph [ref=f44e1171]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f44e1172]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f44e1173] [cursor=pointer]
        - paragraph [ref=f44e1177]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f44e1178]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f44e1179] [cursor=pointer]
        - paragraph [ref=f44e1183]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f44e1184]:
        - button "Как вы обучаете чтению?" [ref=f44e1185] [cursor=pointer]
        - paragraph [ref=f44e1189]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
