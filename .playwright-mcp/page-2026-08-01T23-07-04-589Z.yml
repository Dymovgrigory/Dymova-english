  - generic [ref=f279e527]:
    - generic [ref=f279e528]:
      - generic [ref=f279e529]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f279e531]
      - paragraph [ref=f279e532]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f279e533]:
      - tab "Письменные" [ref=f279e534] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f279e535] [cursor=pointer]
    - generic [ref=f279e537]:
      - article [ref=f279e538]:
        - generic "5 из 5" [ref=f279e539]
        - paragraph [ref=f279e550]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f279e551]:
          - generic [ref=f279e552]: А
          - generic [ref=f279e553]:
            - strong [ref=f279e554]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f279e555]:
        - generic "5 из 5" [ref=f279e556]
        - paragraph [ref=f279e567]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f279e568]:
          - generic [ref=f279e569]: Е
          - generic [ref=f279e570]:
            - strong [ref=f279e571]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f279e572]:
        - generic "5 из 5" [ref=f279e573]
        - paragraph [ref=f279e584]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f279e585]:
          - generic [ref=f279e586]: О
          - generic [ref=f279e587]:
            - strong [ref=f279e588]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f279e589]:
        - generic "5 из 5" [ref=f279e590]
        - paragraph [ref=f279e601]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f279e602]:
          - generic [ref=f279e603]: М
          - generic [ref=f279e604]:
            - strong [ref=f279e605]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f279e606]:
        - generic "5 из 5" [ref=f279e607]
        - paragraph [ref=f279e618]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f279e619]:
          - generic [ref=f279e620]: Н
          - generic [ref=f279e621]:
            - strong [ref=f279e622]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f279e623]:
        - generic "5 из 5" [ref=f279e624]
        - paragraph [ref=f279e635]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f279e636]:
          - generic [ref=f279e637]: И
          - generic [ref=f279e638]:
            - strong [ref=f279e639]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f279e641] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f279e643]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f279e644]
    - paragraph [ref=f279e645]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f279e646]:
      - generic [ref=f279e647]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f279e648] [cursor=pointer]
        - paragraph [ref=f279e652]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f279e653]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f279e654] [cursor=pointer]
        - paragraph [ref=f279e658]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f279e659]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f279e660] [cursor=pointer]
        - paragraph [ref=f279e664]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f279e665]:
        - button "Как проходят занятия?" [ref=f279e666] [cursor=pointer]
        - paragraph [ref=f279e670]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f279e671]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f279e672] [cursor=pointer]
        - paragraph [ref=f279e676]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f279e677]:
        - button "Как оплачиваются занятия?" [ref=f279e678] [cursor=pointer]
        - paragraph [ref=f279e682]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f279e683]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f279e684] [cursor=pointer]
        - paragraph [ref=f279e688]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f279e689]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f279e690] [cursor=pointer]
        - paragraph [ref=f279e694]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f279e695]:
        - button "Как вы обучаете чтению?" [ref=f279e696] [cursor=pointer]
        - paragraph [ref=f279e700]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
