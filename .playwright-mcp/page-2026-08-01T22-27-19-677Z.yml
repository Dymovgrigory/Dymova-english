  - generic [ref=f219e525]:
    - generic [ref=f219e526]:
      - generic [ref=f219e527]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f219e529]
      - paragraph [ref=f219e530]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f219e531]:
      - tab "Письменные" [ref=f219e532] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f219e533] [cursor=pointer]
    - generic [ref=f219e535]:
      - article [ref=f219e536]:
        - generic "5 из 5" [ref=f219e537]
        - paragraph [ref=f219e548]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f219e549]:
          - generic [ref=f219e550]: А
          - generic [ref=f219e551]:
            - strong [ref=f219e552]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f219e553]:
        - generic "5 из 5" [ref=f219e554]
        - paragraph [ref=f219e565]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f219e566]:
          - generic [ref=f219e567]: Е
          - generic [ref=f219e568]:
            - strong [ref=f219e569]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f219e570]:
        - generic "5 из 5" [ref=f219e571]
        - paragraph [ref=f219e582]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f219e583]:
          - generic [ref=f219e584]: О
          - generic [ref=f219e585]:
            - strong [ref=f219e586]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f219e587]:
        - generic "5 из 5" [ref=f219e588]
        - paragraph [ref=f219e599]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f219e600]:
          - generic [ref=f219e601]: М
          - generic [ref=f219e602]:
            - strong [ref=f219e603]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f219e604]:
        - generic "5 из 5" [ref=f219e605]
        - paragraph [ref=f219e616]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f219e617]:
          - generic [ref=f219e618]: Н
          - generic [ref=f219e619]:
            - strong [ref=f219e620]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f219e621]:
        - generic "5 из 5" [ref=f219e622]
        - paragraph [ref=f219e633]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f219e634]:
          - generic [ref=f219e635]: И
          - generic [ref=f219e636]:
            - strong [ref=f219e637]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f219e639] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f219e641]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f219e642]
    - paragraph [ref=f219e643]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f219e644]:
      - generic [ref=f219e645]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f219e646] [cursor=pointer]
        - paragraph [ref=f219e650]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f219e651]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f219e652] [cursor=pointer]
        - paragraph [ref=f219e656]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f219e657]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f219e658] [cursor=pointer]
        - paragraph [ref=f219e662]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f219e663]:
        - button "Как проходят занятия?" [ref=f219e664] [cursor=pointer]
        - paragraph [ref=f219e668]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f219e669]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f219e670] [cursor=pointer]
        - paragraph [ref=f219e674]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f219e675]:
        - button "Как оплачиваются занятия?" [ref=f219e676] [cursor=pointer]
        - paragraph [ref=f219e680]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f219e681]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f219e682] [cursor=pointer]
        - paragraph [ref=f219e686]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f219e687]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f219e688] [cursor=pointer]
        - paragraph [ref=f219e692]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f219e693]:
        - button "Как вы обучаете чтению?" [ref=f219e694] [cursor=pointer]
        - paragraph [ref=f219e698]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
