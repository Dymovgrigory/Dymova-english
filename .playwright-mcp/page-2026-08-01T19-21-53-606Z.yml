  - generic [ref=f131e547]:
    - generic [ref=f131e548]:
      - generic [ref=f131e549]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f131e551]
      - paragraph [ref=f131e552]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f131e553]:
      - tab "Письменные" [ref=f131e554] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f131e555] [cursor=pointer]
    - generic [ref=f131e557]:
      - article [ref=f131e558]:
        - generic "5 из 5" [ref=f131e559]
        - paragraph [ref=f131e570]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f131e571]:
          - generic [ref=f131e572]: А
          - generic [ref=f131e573]:
            - strong [ref=f131e574]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f131e575]:
        - generic "5 из 5" [ref=f131e576]
        - paragraph [ref=f131e587]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f131e588]:
          - generic [ref=f131e589]: Е
          - generic [ref=f131e590]:
            - strong [ref=f131e591]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f131e592]:
        - generic "5 из 5" [ref=f131e593]
        - paragraph [ref=f131e604]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f131e605]:
          - generic [ref=f131e606]: О
          - generic [ref=f131e607]:
            - strong [ref=f131e608]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f131e609]:
        - generic "5 из 5" [ref=f131e610]
        - paragraph [ref=f131e621]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f131e622]:
          - generic [ref=f131e623]: М
          - generic [ref=f131e624]:
            - strong [ref=f131e625]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f131e626]:
        - generic "5 из 5" [ref=f131e627]
        - paragraph [ref=f131e638]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f131e639]:
          - generic [ref=f131e640]: Н
          - generic [ref=f131e641]:
            - strong [ref=f131e642]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f131e643]:
        - generic "5 из 5" [ref=f131e644]
        - paragraph [ref=f131e655]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f131e656]:
          - generic [ref=f131e657]: И
          - generic [ref=f131e658]:
            - strong [ref=f131e659]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f131e661] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f131e663]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f131e664]
    - paragraph [ref=f131e665]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f131e666]:
      - generic [ref=f131e667]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f131e668] [cursor=pointer]
        - paragraph [ref=f131e672]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f131e673]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f131e674] [cursor=pointer]
        - paragraph [ref=f131e678]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f131e679]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f131e680] [cursor=pointer]
        - paragraph [ref=f131e684]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f131e685]:
        - button "Как проходят занятия?" [ref=f131e686] [cursor=pointer]
        - paragraph [ref=f131e690]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f131e691]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f131e692] [cursor=pointer]
        - paragraph [ref=f131e696]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f131e697]:
        - button "Как оплачиваются занятия?" [ref=f131e698] [cursor=pointer]
        - paragraph [ref=f131e702]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f131e703]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f131e704] [cursor=pointer]
        - paragraph [ref=f131e708]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f131e709]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f131e710] [cursor=pointer]
        - paragraph [ref=f131e714]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f131e715]:
        - button "Как вы обучаете чтению?" [ref=f131e716] [cursor=pointer]
        - paragraph [ref=f131e720]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
