  - generic [ref=f195e546]:
    - generic [ref=f195e547]:
      - generic [ref=f195e548]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f195e550]
      - paragraph [ref=f195e551]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f195e552]:
      - tab "Письменные" [ref=f195e553] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f195e554] [cursor=pointer]
    - generic [ref=f195e556]:
      - article [ref=f195e557]:
        - generic "5 из 5" [ref=f195e558]
        - paragraph [ref=f195e569]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f195e570]:
          - generic [ref=f195e571]: А
          - generic [ref=f195e572]:
            - strong [ref=f195e573]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f195e574]:
        - generic "5 из 5" [ref=f195e575]
        - paragraph [ref=f195e586]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f195e587]:
          - generic [ref=f195e588]: Е
          - generic [ref=f195e589]:
            - strong [ref=f195e590]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f195e591]:
        - generic "5 из 5" [ref=f195e592]
        - paragraph [ref=f195e603]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f195e604]:
          - generic [ref=f195e605]: О
          - generic [ref=f195e606]:
            - strong [ref=f195e607]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f195e608]:
        - generic "5 из 5" [ref=f195e609]
        - paragraph [ref=f195e620]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f195e621]:
          - generic [ref=f195e622]: М
          - generic [ref=f195e623]:
            - strong [ref=f195e624]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f195e625]:
        - generic "5 из 5" [ref=f195e626]
        - paragraph [ref=f195e637]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f195e638]:
          - generic [ref=f195e639]: Н
          - generic [ref=f195e640]:
            - strong [ref=f195e641]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f195e642]:
        - generic "5 из 5" [ref=f195e643]
        - paragraph [ref=f195e654]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f195e655]:
          - generic [ref=f195e656]: И
          - generic [ref=f195e657]:
            - strong [ref=f195e658]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f195e660] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f195e662]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f195e663]
    - paragraph [ref=f195e664]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f195e665]:
      - generic [ref=f195e666]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f195e667] [cursor=pointer]
        - paragraph [ref=f195e671]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f195e672]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f195e673] [cursor=pointer]
        - paragraph [ref=f195e677]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f195e678]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f195e679] [cursor=pointer]
        - paragraph [ref=f195e683]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f195e684]:
        - button "Как проходят занятия?" [ref=f195e685] [cursor=pointer]
        - paragraph [ref=f195e689]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f195e690]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f195e691] [cursor=pointer]
        - paragraph [ref=f195e695]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f195e696]:
        - button "Как оплачиваются занятия?" [ref=f195e697] [cursor=pointer]
        - paragraph [ref=f195e701]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f195e702]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f195e703] [cursor=pointer]
        - paragraph [ref=f195e707]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f195e708]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f195e709] [cursor=pointer]
        - paragraph [ref=f195e713]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f195e714]:
        - button "Как вы обучаете чтению?" [ref=f195e715] [cursor=pointer]
        - paragraph [ref=f195e719]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
