  - generic [ref=f303e527]:
    - generic [ref=f303e528]:
      - generic [ref=f303e529]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f303e531]
      - paragraph [ref=f303e532]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f303e533]:
      - tab "Письменные" [ref=f303e534] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f303e535] [cursor=pointer]
    - generic [ref=f303e537]:
      - article [ref=f303e538]:
        - generic "5 из 5" [ref=f303e539]
        - paragraph [ref=f303e550]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f303e551]:
          - generic [ref=f303e552]: А
          - generic [ref=f303e553]:
            - strong [ref=f303e554]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f303e555]:
        - generic "5 из 5" [ref=f303e556]
        - paragraph [ref=f303e567]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f303e568]:
          - generic [ref=f303e569]: Е
          - generic [ref=f303e570]:
            - strong [ref=f303e571]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f303e572]:
        - generic "5 из 5" [ref=f303e573]
        - paragraph [ref=f303e584]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f303e585]:
          - generic [ref=f303e586]: О
          - generic [ref=f303e587]:
            - strong [ref=f303e588]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f303e589]:
        - generic "5 из 5" [ref=f303e590]
        - paragraph [ref=f303e601]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f303e602]:
          - generic [ref=f303e603]: М
          - generic [ref=f303e604]:
            - strong [ref=f303e605]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f303e606]:
        - generic "5 из 5" [ref=f303e607]
        - paragraph [ref=f303e618]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f303e619]:
          - generic [ref=f303e620]: Н
          - generic [ref=f303e621]:
            - strong [ref=f303e622]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f303e623]:
        - generic "5 из 5" [ref=f303e624]
        - paragraph [ref=f303e635]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f303e636]:
          - generic [ref=f303e637]: И
          - generic [ref=f303e638]:
            - strong [ref=f303e639]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f303e641] [cursor=pointer]:
