  - generic [ref=f303e643]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f303e644]
    - paragraph [ref=f303e645]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f303e646]:
      - generic [ref=f303e647]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f303e648] [cursor=pointer]
        - paragraph [ref=f303e652]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f303e653]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f303e654] [cursor=pointer]
        - paragraph [ref=f303e658]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f303e659]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f303e660] [cursor=pointer]
        - paragraph [ref=f303e664]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f303e665]:
        - button "Как проходят занятия?" [ref=f303e666] [cursor=pointer]
        - paragraph [ref=f303e670]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f303e671]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f303e672] [cursor=pointer]
        - paragraph [ref=f303e676]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f303e677]:
        - button "Как оплачиваются занятия?" [ref=f303e678] [cursor=pointer]
        - paragraph [ref=f303e682]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f303e683]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f303e684] [cursor=pointer]
        - paragraph [ref=f303e688]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f303e689]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f303e690] [cursor=pointer]
        - paragraph [ref=f303e694]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f303e695]:
        - button "Как вы обучаете чтению?" [ref=f303e696] [cursor=pointer]
        - paragraph [ref=f303e700]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
