  - generic [ref=f42e568]:
    - generic [ref=f42e569]:
      - generic [ref=f42e570]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f42e572]
      - paragraph [ref=f42e573]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f42e574]:
      - tab "Письменные" [ref=f42e575] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f42e576] [cursor=pointer]
    - generic [ref=f42e578]:
      - article [ref=f42e579]:
        - generic "5 из 5" [ref=f42e580]
        - paragraph [ref=f42e591]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f42e592]:
          - generic [ref=f42e593]: А
          - generic [ref=f42e594]:
            - strong [ref=f42e595]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f42e596]:
        - generic "5 из 5" [ref=f42e597]
        - paragraph [ref=f42e608]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f42e609]:
          - generic [ref=f42e610]: Е
          - generic [ref=f42e611]:
            - strong [ref=f42e612]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f42e613]:
        - generic "5 из 5" [ref=f42e614]
        - paragraph [ref=f42e625]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f42e626]:
          - generic [ref=f42e627]: О
          - generic [ref=f42e628]:
            - strong [ref=f42e629]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f42e630]:
        - generic "5 из 5" [ref=f42e631]
        - paragraph [ref=f42e642]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f42e643]:
          - generic [ref=f42e644]: М
          - generic [ref=f42e645]:
            - strong [ref=f42e646]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f42e647]:
        - generic "5 из 5" [ref=f42e648]
        - paragraph [ref=f42e659]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f42e660]:
          - generic [ref=f42e661]: Н
          - generic [ref=f42e662]:
            - strong [ref=f42e663]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f42e664]:
        - generic "5 из 5" [ref=f42e665]
        - paragraph [ref=f42e676]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f42e677]:
          - generic [ref=f42e678]: И
          - generic [ref=f42e679]:
            - strong [ref=f42e680]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f42e682] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f42e684]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f42e685]
    - paragraph [ref=f42e686]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f42e687]:
      - generic [ref=f42e688]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f42e689] [cursor=pointer]
        - paragraph [ref=f42e693]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f42e694]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f42e695] [cursor=pointer]
        - paragraph [ref=f42e699]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f42e700]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f42e701] [cursor=pointer]
        - paragraph [ref=f42e705]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f42e706]:
        - button "Как проходят занятия?" [ref=f42e707] [cursor=pointer]
        - paragraph [ref=f42e711]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f42e712]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f42e713] [cursor=pointer]
        - paragraph [ref=f42e717]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f42e718]:
        - button "Как оплачиваются занятия?" [ref=f42e719] [cursor=pointer]
        - paragraph [ref=f42e723]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f42e724]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f42e725] [cursor=pointer]
        - paragraph [ref=f42e729]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f42e730]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f42e731] [cursor=pointer]
        - paragraph [ref=f42e735]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f42e736]:
        - button "Как вы обучаете чтению?" [ref=f42e737] [cursor=pointer]
        - paragraph [ref=f42e741]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
