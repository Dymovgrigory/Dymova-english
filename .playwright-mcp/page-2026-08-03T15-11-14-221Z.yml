          - article [ref=f77e902]:
            - generic [ref=f77e903]:
              - generic "Оценка 5 из 5" [ref=f77e904]
              - generic [ref=f77e915]: Яндекс Карты
            - paragraph [ref=f77e916]: Дочь второй год посещает Фокси Фокс, с радостью ходит на занятия. В выходные посещает английский клуб, где происходит общение с носителем языка. Очень нравится, что домашние задания есть не только в тетради, но и в приложении. Также в приложении можно отследить успехи и посещение ребенка,что в нашей жизни очень актуально. Вообще мне нравится семейная и дружелюбная обстановка в этой школе, с удовольствием рекомендую ее всем…
