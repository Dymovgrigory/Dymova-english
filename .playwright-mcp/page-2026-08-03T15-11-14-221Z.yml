            - paragraph [ref=f77e897]: Ребёнку 2,5 года. Ходим на занятия «Мама+малыш». Очень понравилось что во время пребывания в клубе ребёнок полностью погружается в иностранную речь и начиная с приветствия и до прощания все обращения только на английском языке. Отдельно хочу отметить уровень владения языком, а самое главное - произношение, у всех преподавателей на высоком уровне. Жалею только что не узнали об этом месте раньше. Дочка уже после первого занятия…
