        - generic [ref=f15e113]:
          - button "До скольки и когда вы работаете? Какой режим работы?" [ref=f15e114] [cursor=pointer]
          - paragraph: Ежедневно с 9:00 до 21:00, без выходных. Занятия идут утром, днём и вечером — подберём удобное время.
        - generic [ref=f15e118]:
          - button "Вы давно работаете?" [ref=f15e119] [cursor=pointer]
          - paragraph: Работаем с 2020 года — больше 5 лет опыта в обучении детей. Официальная образовательная лицензия, аккредитованный центр международной олимпиады Hippo, рейтинг 5.0 на Яндекс.Картах.
        - generic [ref=f15e123]:
          - button "Кто руководит школой? Кто руководители?" [ref=f15e124] [cursor=pointer]
          - paragraph: Школой руководят Дымова Вероника Александровна и Дымов Григорий Юрьевич. Методист и контроль качества — Коваленко Елизавета. Администраторы — Зверева Ираида и Джанузакова Салтанат.
        - generic [ref=f15e128]:
          - button "У вас есть носитель языка?" [ref=f15e129] [cursor=pointer]
          - paragraph: Да! В офлайн-формат входит разговорный клуб с носителем языка — дети применяют английский в живом общении.
        - generic [ref=f15e133]:
          - button "Можно ли платить помесячно, а не за год?" [ref=f15e134] [cursor=pointer]
          - paragraph: "Да, конечно. Английский в мини-группе: 9 000 ₽/мес при ежемесячной оплате или 8 200 ₽/мес при оплате за учебный год. Малыши 2–3 года: 6 550 ₽/мес или 6 050 ₽/мес за год. Есть рассрочка и оплата маткапиталом."
