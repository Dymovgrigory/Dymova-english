  - generic [ref=f30e568]:
    - generic [ref=f30e569]:
      - generic [ref=f30e570]: Отзывы
      - heading "Что говорят родители" [level=2] [ref=f30e572]
      - paragraph [ref=f30e573]: Реальные истории семей, которые выбрали Фоксинбург. Письменные и видеоотзывы — без фильтров и постановки.
    - tablist [ref=f30e574]:
      - tab "Письменные" [ref=f30e575] [cursor=pointer]
      - tab "Видеоотзывы" [ref=f30e576] [cursor=pointer]
    - generic [ref=f30e578]:
      - article [ref=f30e579]:
        - generic "5 из 5" [ref=f30e580]
        - paragraph [ref=f30e591]: Дочка ходит с удовольствием и сама напоминает про занятия. За полгода заговорила фразами, перестала бояться ошибок. Отдельное спасибо педагогу за тёплое отношение к детям!
        - generic [ref=f30e592]:
          - generic [ref=f30e593]: А
          - generic [ref=f30e594]:
            - strong [ref=f30e595]: Анна
            - text: мама Софии, 6 лет
      - article [ref=f30e596]:
        - generic "5 из 5" [ref=f30e597]
        - paragraph [ref=f30e608]: Искали школу рядом с домом в Долгопрудном и не прогадали. Маленькие группы, живые уроки, регулярные отчёты о прогрессе. Сын подтянул английский в школе и теперь среди лучших в классе.
        - generic [ref=f30e609]:
          - generic [ref=f30e610]: Е
          - generic [ref=f30e611]:
            - strong [ref=f30e612]: Екатерина
            - text: мама Миши, 9 лет
      - article [ref=f30e613]:
        - generic "5 из 5" [ref=f30e614]
        - paragraph [ref=f30e625]: Подросток сначала сопротивлялся, а теперь сам делает домашку в приложении. Преподаватели нашли подход, занятия не похожи на скучные школьные уроки. Готовимся к ОГЭ спокойно и уверенно.
        - generic [ref=f30e626]:
          - generic [ref=f30e627]: О
          - generic [ref=f30e628]:
            - strong [ref=f30e629]: Ольга
            - text: мама Артёма, 14 лет
      - article [ref=f30e630]:
        - generic "5 из 5" [ref=f30e631]
        - paragraph [ref=f30e642]: Очень удобно, что есть утренние группы для второй смены. Ребёнок не устаёт, всё успевает. Администратор всегда на связи, помогает с расписанием. Рекомендую всем знакомым!
        - generic [ref=f30e643]:
          - generic [ref=f30e644]: М
          - generic [ref=f30e645]:
            - strong [ref=f30e646]: Марина
            - text: мама Вари, 8 лет
      - article [ref=f30e647]:
        - generic "5 из 5" [ref=f30e648]
        - paragraph [ref=f30e659]: Начинали с нуля в 4 года через игры и песни. Сейчас сын понимает мультики на английском без перевода. Атмосфера в школе тёплая, видно, что детей здесь действительно любят.
        - generic [ref=f30e660]:
          - generic [ref=f30e661]: Н
          - generic [ref=f30e662]:
            - strong [ref=f30e663]: Наталья
            - text: мама Лёвы, 5 лет
      - article [ref=f30e664]:
        - generic "5 из 5" [ref=f30e665]
        - paragraph [ref=f30e676]: Дочь занимается ещё и немецким с Алиной — педагог потрясающий. Видно системный подход и заботу о результате. Прозрачная оплата, удобное приложение, всё по-современному.
        - generic [ref=f30e677]:
          - generic [ref=f30e678]: И
          - generic [ref=f30e679]:
            - strong [ref=f30e680]: Ирина
            - text: мама Полины, 11 лет
    - link "Хотите так же? Записаться" [ref=f30e682] [cursor=pointer]:
      - /url: "#fxb-enrollment"
  - generic [ref=f30e684]:
    - heading "Часто задаваемые вопросы" [level=2] [ref=f30e685]
    - paragraph [ref=f30e686]: Ответы на самые популярные вопросы от родителей
    - generic [ref=f30e687]:
      - generic [ref=f30e688]:
        - button "Я не уверена, понравится ли моему ребенку?" [ref=f30e689] [cursor=pointer]
        - paragraph [ref=f30e693]: Мы приглашаем на бесплатную пробную диагностику, где ребёнок познакомится с педагогом и атмосферой занятий. Более 90% детей после пробного урока хотят продолжить обучение!
      - generic [ref=f30e694]:
        - button "Мой даже букв не знает. Как он будет заниматься, если все только на английском?" [ref=f30e695] [cursor=pointer]
        - paragraph [ref=f30e699]: Мы работаем с детьми с нулевого уровня. Педагоги используют игровую методику, TPR (полное физическое реагирование) и визуальные материалы. Ребёнок начинает понимать и говорить естественно, как осваивал родной язык.
      - generic [ref=f30e700]:
        - button "А ваша программа совпадает со школьной? Ребенок не запутается?" [ref=f30e701] [cursor=pointer]
        - paragraph [ref=f30e705]: "Наша программа дополняет школьную и идёт глубже. Мы не просто учим грамматику — мы развиваем все четыре навыка: говорение, аудирование, чтение и письмо. Благодаря этому дети чувствуют себя увереннее и в школе."
      - generic [ref=f30e706]:
        - button "Как проходят занятия?" [ref=f30e707] [cursor=pointer]
        - paragraph [ref=f30e711]: Занятия проходят в мини-группах до 7 человек. Каждый урок включает разговорную практику, игровые активности, работу с учебными материалами и закрепление через интерактивное приложение. Длительность — 45–60 минут в зависимости от возраста.
      - generic [ref=f30e712]:
        - button "Сколько раз в неделю проходят занятия?" [ref=f30e713] [cursor=pointer]
        - paragraph [ref=f30e717]: Занятия проходят 2 раза в неделю по 60 минут. Мы предлагаем утренние, дневные и вечерние группы, чтобы подобрать удобное расписание для вашей семьи.
      - generic [ref=f30e718]:
        - button "Как оплачиваются занятия?" [ref=f30e719] [cursor=pointer]
        - paragraph [ref=f30e723]: Оплата производится помесячно или за семестр (со скидкой). Принимаем банковские карты, переводы, а также маткапитал. Подробную информацию о ценах можно узнать у администратора.
      - generic [ref=f30e724]:
        - button "Задаете ли вы домашние задания? Я не смогу помогать, так как не знаю языка." [ref=f30e725] [cursor=pointer]
        - paragraph [ref=f30e729]: Да, домашние задания выполняются через наше мобильное приложение. Они разработаны так, чтобы ребёнок мог делать их самостоятельно — в игровом формате с подсказками. Помощь родителей не требуется!
      - generic [ref=f30e730]:
        - button "Как я пойму, что у ребенка появился результат?" [ref=f30e731] [cursor=pointer]
        - paragraph [ref=f30e735]: "Мы предоставляем: еженедельные видео-отчёты, отчёты о том, что было на уроке, открытые уроки, регулярные тестирования с обратной связью. Вы всегда будете в курсе прогресса ребёнка."
      - generic [ref=f30e736]:
        - button "Как вы обучаете чтению?" [ref=f30e737] [cursor=pointer]
        - paragraph [ref=f30e741]: Мы используем метод фониксов (Phonics) — ребёнок учится читать через звуки, а не через зубрёжку букв. Это естественный и эффективный подход, который позволяет детям начать читать уже через несколько месяцев.
