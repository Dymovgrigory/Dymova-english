<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foxinburg — 3D Hero Demo</title>
<style>
  :root {
    --purple: #662d92;
    --purple-dark: #392852;
    --yellow: #fcf951;
    --coral: #ee7349;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--purple-dark);
    color: #faf8fd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  #hero {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #hero-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #fallback-gradient {
    position: absolute;
    inset: 0;
    display: none;
    background: radial-gradient(circle at 30% 30%, var(--yellow), transparent 60%),
                radial-gradient(circle at 70% 70%, var(--coral), transparent 60%),
                radial-gradient(circle at 50% 50%, var(--purple), transparent 70%);
  }
  #hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 640px;
    padding: 0 24px;
  }
  #hero-content h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    margin: 0 0 16px;
    line-height: 1.1;
  }
  #hero-content p {
    font-size: clamp(1rem, 2vw, 1.25rem);
    opacity: 0.85;
    margin: 0 0 28px;
  }
  #hero-content .cta {
    display: inline-block;
    padding: 14px 32px;
    border-radius: 999px;
    background: var(--yellow);
    color: var(--purple-dark);
    font-weight: 700;
    text-decoration: none;
  }
  .spacer {
    height: 150vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(250, 248, 253, 0.4);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<section id="hero">
  <canvas id="hero-canvas"></canvas>
  <div id="fallback-gradient"></div>
  <div id="hero-content">
    <h1>Placeholder: English school hero copy</h1>
    <p>Демо-текст — не финальный копирайт. Оценивается только визуальный стиль 3D-сцены.</p>
    <a class="cta" href="#">Placeholder CTA</a>
  </div>
</section>

<div class="spacer">↓ scroll to see the parallax ↓</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

const canvas = document.getElementById("hero-canvas");
const fallback = document.getElementById("fallback-gradient");

const BRAND_COLORS = [0x662d92, 0xfcf951, 0xee7349, 0x2bb673];

function initScene() {
  const isMobile = window.matchMedia("(max-width: 768px)").matches;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    50,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.z = 8;

  const ambient = new THREE.AmbientLight(0xffffff, isMobile ? 1.1 : 0.6);
  scene.add(ambient);
  if (!isMobile) {
    const directional = new THREE.DirectionalLight(0xffffff, 1.2);
    directional.position.set(3, 4, 5);
    scene.add(directional);
  }

  const segments = isMobile ? 16 : 32;

  const geometries = [
    new THREE.SphereGeometry(1.2, segments, segments),
    new THREE.TorusGeometry(1, 0.35, Math.max(8, segments / 2), segments),
    new THREE.IcosahedronGeometry(1, isMobile ? 0 : 1),
    new THREE.IcosahedronGeometry(0.7, isMobile ? 0 : 1),
    new THREE.BoxGeometry(1.3, 1.3, 1.3, 2, 2, 2),
  ];

  const noiseGLSL = `
    // Simplex noise (Ashima Arts, public domain)
    vec3 mod289(vec3 x){return x - floor(x * (1.0/289.0)) * 289.0;}
    vec4 mod289(vec4 x){return x - floor(x * (1.0/289.0)) * 289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
              + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ *ns.x + ns.yyyy;
      vec4 y = y_ *ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }
  `;

  const meshes = geometries.map((geo, i) => {
    const material = new THREE.MeshPhysicalMaterial({
      color: BRAND_COLORS[i % BRAND_COLORS.length],
      roughness: 0.2,
      transmission: 0.6,
      thickness: 1.0,
      metalness: 0.05,
    });
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = { value: 0 };
      material.userData.shader = shader;
      shader.vertexShader = shader.vertexShader
        .replace(
          "#include <common>",
          `#include <common>\nuniform float uTime;\n${noiseGLSL}`
        )
        .replace(
          "#include <begin_vertex>",
          `#include <begin_vertex>
           float n = snoise(position * 1.5 + uTime * 0.3 + float(${i}) * 10.0);
           transformed += normal * n * 0.06;`
        );
    };
    const mesh = new THREE.Mesh(geo, material);
    scene.add(mesh);
    return mesh;
  });

  // Spread meshes across the viewport, each with its own depth/parallax factor.
  const layout = [
    { x: -2.4, y: 0.6, z: 0, depth: 0.6 },
    { x: 2.2, y: -0.8, z: -1, depth: 1.0 },
    { x: -1.2, y: -1.4, z: 1, depth: 0.4 },
    { x: 2.6, y: 1.2, z: -0.5, depth: 0.8 },
    { x: 0.3, y: 0.2, z: -2, depth: 1.3 },
  ];
  meshes.forEach((m, i) => {
    m.position.set(layout[i].x, layout[i].y, layout[i].z);
  });

  let rawScroll = window.scrollY;
  let smoothScroll = rawScroll;
  window.addEventListener(
    "scroll",
    () => {
      rawScroll = window.scrollY;
    },
    { passive: true }
  );

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    smoothScroll += (rawScroll - smoothScroll) * 0.08;
    const scrollFactor = smoothScroll / window.innerHeight;

    meshes.forEach((m, i) => {
      const depth = layout[i].depth;
      m.position.y = layout[i].y - scrollFactor * depth * 3;
      m.rotation.x = t * 0.15 + scrollFactor * 0.4;
      m.rotation.y = t * 0.1 + scrollFactor * 0.6;
      const shader = m.material.userData.shader;
      if (shader) shader.uniforms.uTime.value = t;
    });

    scene.rotation.z = scrollFactor * 0.05;

    renderer.render(scene, camera);
  }
  animate();
}

try {
  initScene();
} catch (err) {
  console.error("3D hero init failed, falling back to static gradient:", err);
  canvas.style.display = "none";
  fallback.style.display = "block";
}
</script>

</body>
</html>
