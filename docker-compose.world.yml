# Foxinburg World — API + Next
# На VM: docker compose -f docker-compose.world.yml --env-file world/.env.production up -d --build
# Контейнеры входят в сеть bot_default, чтобы Caddy резолвил world-web / world-api по имени.

services:
  world-api:
    build:
      context: ./world-backend
    container_name: world-api
    restart: unless-stopped
    environment:
      WORLD_PLAYER_SECRET: ${WORLD_PLAYER_SECRET:?set WORLD_PLAYER_SECRET}
      WORLD_CORS_ORIGINS: ${WORLD_CORS_ORIGINS:-https://world.dymova-english.ru,https://new.dymova-english.ru}
      WORLD_DB_PATH: /app/data/world.sqlite
      WORLD_UNLOCK_ALL: ${WORLD_UNLOCK_ALL:-0}
      CASTLE_OPEN_ALL: ${CASTLE_OPEN_ALL:-0}
      WORLD_DATABASE_URL: ${WORLD_DATABASE_URL:-}
      ADMIN_BOOTSTRAP_LOGIN: ${ADMIN_BOOTSTRAP_LOGIN:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      PHONE_VERIFICATION_REQUIRED: ${PHONE_VERIFICATION_REQUIRED:-0}
      SMSAERO_EMAIL: ${SMSAERO_EMAIL:-}
      SMSAERO_API_KEY: ${SMSAERO_API_KEY:-}
      SMSAERO_SIGN: ${SMSAERO_SIGN:-}
      # Вход через мини-приложения мессенджеров (валидация initData)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      # Мост к школьному боту: предзаполнение анкеты лидами из бота
      WORLD_BOT_BRIDGE_URL: ${WORLD_BOT_BRIDGE_URL:-http://bot:8000/world-bridge/profile}
      WORLD_BRIDGE_SECRET: ${WORLD_BRIDGE_SECRET:-}
    volumes:
      - world_data:/app/data
    expose:
      - "8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bot_default

  world-web:
    build:
      context: ./world
      args:
        NEXT_PUBLIC_WORLD_API: ${NEXT_PUBLIC_WORLD_API:-https://world-api.dymova-english.ru}
    container_name: world-web
    restart: unless-stopped
    depends_on:
      world-api:
        condition: service_healthy
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bot_default

volumes:
  world_data:

networks:
  bot_default:
    external: true
    name: bot_default
