# Foxinburg World — API :8010 + Next :3002
# Запуск на VM: docker compose -f docker-compose.world.yml --env-file world/.env.production up -d --build

services:
  world-api:
    build:
      context: ./world-backend
    container_name: world-api
    restart: unless-stopped
    environment:
      WORLD_PLAYER_SECRET: ${WORLD_PLAYER_SECRET:?set WORLD_PLAYER_SECRET}
      WORLD_CORS_ORIGINS: ${WORLD_CORS_ORIGINS:-https://world.dymova-english.ru}
      WORLD_DB_PATH: /app/data/world.sqlite
      WORLD_DATABASE_URL: ${WORLD_DATABASE_URL:-}
    volumes:
      - world_data:/app/data
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  world-web:
    build:
      context: ./world
      args:
        NEXT_PUBLIC_WORLD_API: ${NEXT_PUBLIC_WORLD_API:-https://world-api.dymova-english.ru}
    container_name: world-web
    restart: unless-stopped
    depends_on:
      world-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  world_data:
